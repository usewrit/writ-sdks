name: Release — PyPI

#   git tag python-v0.1.0 && git push origin python-v0.1.0
#
# Uses PyPI TRUSTED PUBLISHING (OIDC) — no API token anywhere. Unlike npm, PyPI
# lets you register a "pending publisher" for a project that does NOT exist yet,
# so even the very first release needs no long-lived credential:
#   PyPI → Your projects → Publishing → Add a pending publisher
#     owner: usewrit   repo: writ-sdks
#     workflow: release-pypi.yml   environment: pypi
on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish writ-agent
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Required for trusted publishing — this IS the credential.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: python
        run: |
          tag="${GITHUB_REF#refs/tags/python-v}"
          pkg="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag python-v$tag does not match pyproject version $pkg"
            exit 1
          fi
          echo "publishing writ-agent==$pkg"

      - name: Test
        working-directory: python
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Build
        working-directory: python
        run: |
          pip install build twine
          python -m build --outdir dist
          twine check dist/*

      - name: Verify the artifacts carry LICENSE and tests
        working-directory: python
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          sd = glob.glob("dist/*.tar.gz")[0]
          names = tarfile.open(sd).getnames()
          assert any(n.endswith("/LICENSE") for n in names), "sdist has no LICENSE"
          assert any("/tests/" in n for n in names), "sdist has no tests"
          wh = glob.glob("dist/*.whl")[0]
          assert any("LICENSE" in n for n in zipfile.ZipFile(wh).namelist()), "wheel has no LICENSE"
          print("artifacts ok:", sd, wh)
          PY

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

      - name: Dry run only
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "dry_run=true — artifacts verified, nothing published."
