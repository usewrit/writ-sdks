name: Release — npm

# Four packages share this repo, so each has its OWN tag prefix and its own
# workflow. A PyPI outage must not block an npm release, and a tag has to say
# unambiguously which package it cuts.
#
#   git tag typescript-v0.1.0 && git push origin typescript-v0.1.0
on:
  push:
    tags:
      - "typescript-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @usewrit/agent-sdk
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # npm provenance: binds the tarball to this workflow, repo and commit.
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Provenance needs npm >= 9.5; trusted publishing needs >= 11.5.1.
      - name: Use a current npm
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/typescript-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag typescript-v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing @usewrit/agent-sdk@$pkg"

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Verify the tarball
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const raw = require("/tmp/pack.json");
            const p = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            const files = p.files.map(f => f.path);
            for (const want of ["LICENSE", "README.md", "package.json"]) {
              if (!files.includes(want)) { console.error("missing: " + want); process.exit(1); }
            }
            if (!files.some(f => f.startsWith("dist/"))) { console.error("no dist/"); process.exit(1); }
            console.log("tarball ok: " + files.length + " files");
          '

      # AUTH: trusted publishing (configure this repo+workflow on npmjs.com) or
      # NPM_TOKEN in the `npm-publish` environment. Provenance works either way.
      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run only
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "dry_run=true — tarball verified, nothing published."
