openapi: 3.1.0
info:
  title: Writ Agent API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Loopback HTTP API of the Writ local agent (`writ-agentd`), the daemon embedded in the
    Writ desktop app and the self-host build. This document is generated against the Rust
    daemon source (`writ-agent/src/local/`), which is the wire truth.

    ## Transport

    - Plain HTTP on `127.0.0.1:8131` (default; `WRIT_PORT` env overrides).
    - Optional HTTPS twin on `127.0.0.1:8132`, served with a certificate minted by a
      per-install, name-constrained local CA (`~/.writ/tls/ca.pem`). Clients must trust that
      CA file (or pin it) to use the TLS port; the payloads are identical on both ports.
    - The daemon enforces a DNS-rebind guard: `Host`/`Origin` must be loopback. Talk to
      `127.0.0.1`, not `localhost`.

    ## Errors

    Domain errors are JSON `{"error": "<message>", "code": "<stable_code>"}` (see the
    `Error` schema). Codes include `bad_request`, `unauthorized`, `forbidden`, `not_found`,
    `vault_locked` (HTTP 423), `too_many_requests`, `device_capacity` (HTTP 409),
    `captcha_required` (HTTP 402), `internal`.

    **Caveat:** some 4xx bodies are `text/plain`, not JSON — axum framework rejections
    (e.g. a JSON body that fails to deserialize returns
    `Failed to deserialize the JSON body into the target type: missing field 'url'` as
    plain text with a 4xx status). Clients must tolerate non-JSON error bodies.

    ## List envelopes

    The wire is deliberately documented as-is (SDKs normalize; this spec does not):

    - `{"data": [...], "count": n}` — workflows, personas, persona runs, secrets, files, keys
    - `{"data": [...], "count": n, "total": n}` — runs
    - **bare JSON array** — monitors, monitor selectors, extractors, automations,
      `/v1/changes/recent`
    - bespoke objects — `/v1/monitors/{id}/changes`, `/v1/data`, the workflow-data table
servers:
  - url: http://127.0.0.1:8131
    description: Plain-HTTP loopback listener (default port; WRIT_PORT overrides).
  - url: https://127.0.0.1:8132
    description: >-
      HTTPS twin of the same API, terminated with a certificate from the per-install local
      CA at ~/.writ/tls/ca.pem. Trust that CA (or pin it) in your HTTP client.
security:
  - bearerAuth: []
tags:
  - name: agent
    description: Daemon status and deep health (both require auth like every other route).
  - name: workflows
    description: Recorded workflow CRUD, async run/cancel, and the browserless HTTP-lane session.
  - name: runs
    description: Read-only run feed, per-run results/data, live SSE events, and cancel-by-run-id.
  - name: monitors
    description: Page monitors (the `targets` table), device check capacity, and change history.
  - name: selectors
    description: Per-monitor content selectors (text / html / visual) nested under monitors.
  - name: extractors
    description: Field extractors that turn a selector's captured content into typed values.
  - name: automations
    description: Event → action rules (change_detected, webhook_received, workflow lifecycle).
  - name: personas
    description: Login identities (credentials, TOTP, fingerprint, proxy) — secrets sealed daemon-side.
  - name: secrets
    description: Vault secrets addressed by unique text key; values never leave the daemon.
  - name: vault
    description: App-lock control surface (status / lock / unlock).
  - name: files
    description: OpenAI-style encrypted-at-rest file handles (metadata + byte I/O).
  - name: data
    description: Extracted-data explorer — aggregate tables, facets, exports, lineage runs.
  - name: datasets
    description: >-
      Unified read-only catalogue over everything that has accumulated extracted data —
      crawl and workflow origins alike, keyed by the same id (`source_type` tells them
      apart). Records/export/search accept `?format=json|csv|markdown|html`; a non-json
      format returns rendered TEXT instead of the JSON envelope, and markdown/html are
      CONTENT-AWARE (a crawl's pages render as documents, structured data as a table).
      Mirrors the cloud `/api/v1/datasets/*` surface (tagged `Public API · Datasets`),
      so a dataset reads the same locally or forwarded to the fleet.
  - name: crawl
    description: Dragnet whole-site crawl — start/list/poll/cancel; pages aggregate under a synthetic workflow.
  - name: cloud
    description: >-
      Tiered Writ CLOUD surface (scrape / map / crawl) — runs on the cloud, NOT the local daemon.
      These operations target the cloud server (`https://api.usewrit.app`), overriding the daemon
      `servers` above. Two tiers, resolved by credential: METERED with an `Authorization: Bearer`
      API key (the `/api/crawl/*` paths, billed per page), or KEYLESS with no key (the `/v1/keyless/*`
      paths, free but daily-capped per `X-Writ-Client-Id` device id and per IP). Whole-site crawl is
      metered-only; keyless covers scrape + map. See the hand-written SDKs' `cloud` surface.
  - name: keys
    description: Scoped `wlk_` API keys for external clients (requires the full-access `wlt_` token).
  - name: ws-ticket
    description: Single-use WebSocket connect tickets (`wtk_…`) for the recorder / AI-preview sockets.

paths:
  # ---------------------------------------------------------------- agent ---
  /v1/agent:
    get:
      operationId: getAgentStatus
      tags: [agent]
      summary: Lightweight agent status
      description: >-
        Enriched daemon status for UIs/CLIs: version, active run count, scheduler liveness,
        and the warm-browser hint. Requires auth (used as the SDK discovery liveness probe).
      responses:
        '200':
          description: Daemon status snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/health:
    get:
      operationId: getHealth
      tags: [agent]
      summary: Deep health probe
      description: >-
        Self-checking health: SQLCipher reachability, keyring availability, scheduler
        liveness, and cloud-link reflection. No secrets are included. Requires auth.
      responses:
        '200':
          description: Health report (`status` is `ok` or `degraded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------ workflows ---
  /v1/workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List workflows
      description: >-
        Newest-first workflow list. Returns the `{data, count}` envelope. Every row is
        redacted: `credentials_encrypted` never appears; `has_credentials`,
        `credential_keys`, `placeholders` and `has_login` are computed server-side.
      parameters:
        - name: active_only
          in: query
          description: Filter to `is_active = 1` rows (default `true`).
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          description: Page size (clamped to 1..=1000 by the store; default 100).
          schema:
            type: integer
            format: int64
            default: 100
      responses:
        '200':
          description: Workflow page in the `{data, count}` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Create a workflow
      description: >-
        Creates a workflow row. A plaintext `credentials` map (if present and non-empty) is
        sealed handler-side into the row-bound encrypted blob and never echoed back; sending
        one while the vault app-lock is engaged and locked yields 423.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '200':
          description: The created (redacted) workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/VaultLocked'

  /v1/workflows/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Get one workflow
      description: >-
        One redacted workflow row. A marketplace PROXY row (`marketplace_slug` set)
        additionally carries a `marketplace` attach projection and merged placeholders.
      responses:
        '200':
          description: The (redacted) workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update a workflow
      description: >-
        Sparse update — absent fields are untouched. `is_active` changes are silently
        dropped (deactivation is retired; delete is the only removal). A too-fast
        `schedule_interval_ms` is floored to the 60s scheduler minimum. A plaintext
        `credentials` map is sealed handler-side (423 when the vault is locked).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: The refreshed (redacted) workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/VaultLocked'
    delete:
      operationId: deleteWorkflow
      tags: [workflows]
      summary: Delete a workflow
      description: >-
        HARD delete — the row and its runs (and their artifacts) cascade away. Deleting a
        marketplace PROXY row also uninstalls the listing (the response then carries an
        `uninstall` summary object).
      responses:
        '200':
          description: Deletion acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDeleteResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{id}/run:
    post:
      operationId: runWorkflow
      tags: [workflows]
      summary: Run a workflow (async by default, or wait for the result)
      description: >-
        Starts the workflow and, by default, returns `202 {run_id, status: "running"}`.
        Observe progress via `GET /v1/runs/{id}/events` (SSE) and read the outcome from
        `GET /v1/runs/{id}`.


        With `?wait=true` the call BLOCKS until the run reaches a terminal state and returns
        `200` with the run's own result. This mirrors the cloud managed gateway's contract, so
        the same mental model holds locally and in the cloud. Exceeding `timeout` answers `504`
        with the `run_id` still valid — the run keeps going and stays observable, so a slow run
        is collected rather than re-run. A run that FAILS is reported as `200` with
        `status: "failed"`, not as an HTTP error: a caller must be able to distinguish a failed
        workflow from a rejected request.


        Dispatch is identical either way — waiting is a delivery choice, not a different way to
        execute, so the run is equally cancellable and streamable in both modes.


        With `dry_run: true` the call is validate-only — nothing executes — and returns `200`
        with the parsed step plan. `form_data` is accepted as an alias for `inputs` (when
        `inputs` is absent, `form_data` becomes the run inputs).
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - name: wait
          in: query
          required: false
          description: Block until the run is terminal instead of returning 202.
          schema:
            type: boolean
            default: false
        - name: timeout
          in: query
          required: false
          description: >-
            Seconds to block for when `wait=true`. Clamped to [1, 3600].
          schema:
            type: integer
            minimum: 1
            maximum: 3600
            default: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunWorkflowRequest'
      responses:
        '202':
          description: The run was started asynchronously (default, or `wait=false`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '200':
          description: >-
            The terminal run document (`wait=true`), or the dry-run report
            (`dry_run: true`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RunCompleted'
                  - $ref: '#/components/schemas/DryRunReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '504':
          description: >-
            `wait=true` budget expired. The run is STILL RUNNING and the `run_id` remains
            valid — collect it at `status_url` or stream `events_url`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStillRunning'

  /v1/workflows/{id}/cancel:
    post:
      operationId: cancelWorkflow
      tags: [workflows]
      summary: Cancel the newest live run of a workflow
      description: >-
        Signals cancellation of the workflow's most recent `running` run. Returns
        `202 {id, run_id, status: "cancel_requested"}` when a live run was signalled, or
        `409 {status: "not_running"}` when there is no in-flight cancellable run.
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '202':
          description: A live run was signalled to cancel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCancelAccepted'
        '409':
          description: No in-flight, cancellable run for this workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCancelConflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{id}/session:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      operationId: getWorkflowSession
      tags: [workflows]
      summary: Browserless HTTP-lane session status
      description: >-
        Whether the workflow holds a persisted browserless-HTTP-lane login session. When no
        session row exists the response is `{workflow_id, has_session: false}` with no other
        fields.
      responses:
        '200':
          description: Session status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: clearWorkflowSession
      tags: [workflows]
      summary: Clear the persisted session
      description: >-
        Drops the workflow's persisted browserless-HTTP-lane session so the next run logs in
        fresh. No-op (still 200) when there is no saved session.
      responses:
        '200':
          description: Session cleared (idempotent).
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared:
                    type: boolean
                    const: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ----------------------------------------------------------------- runs ---
  /v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List runs (enriched feed)
      description: >-
        Newest-first run feed in the `{data, count, total}` envelope (`total` is the
        post-filter total before pagination; `count` is the page length). Each item is an
        enriched `RunFeedItem` projection, not the raw row. Without a `run_type` filter,
        successful monitor checks are suppressed (only failed checks surface in the unified
        feed).
      parameters:
        - name: entity_id
          in: query
          description: >-
            Scope to one entity, interpreted per `run_type` (workflow_id / target_id /
            automation_id). Aliases `workflow_id` for workflow-type queries.
          schema:
            type: integer
            format: int64
        - name: workflow_id
          in: query
          description: Legacy alias for `entity_id` on workflow-type queries.
          schema:
            type: integer
            format: int64
        - name: run_type
          in: query
          description: >-
            Filter by feed run type. Only workflow runs persist locally today, so
            `check`/`automation` yield an empty page.
          schema:
            type: string
            enum: [workflow, check, automation]
        - name: status
          in: query
          description: Filter by run status (e.g. `running`, `success`, `failed`).
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (clamped to 1..=1000; default 100).
          schema:
            type: integer
            format: int64
            default: 100
        - name: offset
          in: query
          description: Pagination offset (applied after scoping/projection).
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: Run feed page in the `{data, count, total}` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get one run
      description: >-
        One run as the enriched `RunFeedItem` projection (same shape as the list). The path
        id is the NUMERIC run row id — the part after the last dash of the feed item's
        composite string `id`.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The enriched run feed item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunFeedItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/runs/{id}/results:
    get:
      operationId: getRunResults
      tags: [runs]
      summary: Raw run result payload
      description: >-
        The run's raw `result_data` JSON. `result` is `null` when the run produced no
        payload (still running, or none written).
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run result envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/runs/{id}/data:
    get:
      operationId: getRunData
      tags: [runs]
      summary: Extracted data of one run
      description: >-
        The run's extracted output (the `extracted_data` key of `result_data`, falling back
        to the whole result payload). With `?format=csv` the response is a CSV attachment
        (`text/csv`) flattening the run's records — one row per extracted record.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: format
          in: query
          description: '`json` (default) or `csv`.'
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Extracted data (JSON envelope, or CSV when `?format=csv`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunData'
            text/csv:
              schema:
                type: string
                description: Flattened per-record CSV (run metadata columns + data columns).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/runs/{id}/events:
    get:
      operationId: streamRunEvents
      tags: [runs]
      summary: Live run event stream (SSE)
      description: |
        Server-Sent Events (`text/event-stream`) stream of the run's lifecycle.

        - Frames are **named** SSE events (`event: <name>` + `data: <json>`) with name one
          of `started | step | progress | finished | error`. The JSON payload also carries
          the same discriminant in an `"event"` field (serde tag), so parsing `data` alone
          is sufficient.
        - `finished` and `error` are **stream-closing** — the connection ends after one of
          them is delivered.
        - Keep-alive **comment frames** (lines starting with `:`) are emitted every 15
          seconds and must be ignored by parsers.
        - A run that is already finished (or not live in the engine registry) yields exactly
          one synthetic terminal frame, then the stream closes immediately.
        - A live subscription is seeded with a synthetic `started` frame
          (`total_steps` may be 0 in that seed) since the broadcast channel does not replay.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: >-
            SSE stream. Each event's `data:` line is one JSON document matching the
            `RunEvent` schema (tagged by its `event` field).
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RunEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/runs/{id}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a live run by run id
      description: >-
        Cancels any run row directly (including ad-hoc runs with no workflow). Returns
        `202 {run_id, status: "cancel_requested"}` when a live run was signalled, or
        `409 {status: "not_running"}` when the run is already terminal or the engine holds
        no live handle. The 409 is a valid domain answer, not a failure.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '202':
          description: The live run was signalled to cancel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCancelAccepted'
        '409':
          description: The run is not in a cancellable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCancelConflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------- monitors ---
  /v1/monitors:
    get:
      operationId: listMonitors
      tags: [monitors]
      summary: List monitors
      description: >-
        Newest-first monitor list. **Returns a bare JSON array** (no envelope). Each row is
        enriched with live check state (`state`, `last_checked_at`, `status_code`, `is_up`,
        `last_change_at`, `state_updated_at`) plus `changes_count` and `selector_count`.
        `setup_steps` credentials are redacted to a sentinel.
      parameters:
        - name: limit
          in: query
          description: Page size (clamped to 1..=500; default 100).
          schema:
            type: integer
            format: int64
            default: 100
        - name: check_type
          in: query
          description: Optional `content` / `uptime` filter.
          schema:
            type: string
            enum: [content, uptime]
      responses:
        '200':
          description: Bare array of enriched monitors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Monitor'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createMonitor
      tags: [monitors]
      summary: Create a monitor
      description: >-
        Creates a target. Requires a non-empty `url`. The requested `check_period_ms` is
        floored to the anti-detection minimum for the chosen path (HTML vs Playwright). An
        enabled monitor whose cadence would exceed the machine's sustainable checks/min
        budget is refused with `409 device_capacity`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorCreate'
      responses:
        '200':
          description: The created monitor row (setup-step credentials redacted; not state-enriched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Device check-capacity budget exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCapacityError'

  /v1/monitors/capacity:
    get:
      operationId: getMonitorCapacity
      tags: [monitors]
      summary: Device check-capacity meter
      description: >-
        How much of this machine's sustainable checks/min budget the enabled monitors
        consume. Device protection, not a billing surface.
      responses:
        '200':
          description: Capacity snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacitySnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/monitors/{id}:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      operationId: getMonitor
      tags: [monitors]
      summary: Get one monitor
      description: One target, enriched with live check state and counts.
      responses:
        '200':
          description: The enriched monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMonitor
      tags: [monitors]
      summary: Update a monitor
      description: >-
        Partial update (COALESCE semantics — absent fields untouched). Cadence/path changes
        are re-floored to the anti-detection minimum, and load increases pass through the
        device-capacity gate (`409 device_capacity` on refusal).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorUpdate'
      responses:
        '200':
          description: The refreshed monitor row (setup-step credentials redacted; not state-enriched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Device check-capacity budget exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCapacityError'
    delete:
      operationId: deleteMonitor
      tags: [monitors]
      summary: Delete a monitor
      description: Hard-delete (cascades to selectors, state, changes, uptime samples).
      responses:
        '200':
          description: Deletion acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/monitors/{id}/run:
    post:
      operationId: runMonitor
      tags: [monitors]
      summary: Run a monitor check now
      description: >-
        Forces a check regardless of schedule (still respecting the 60s anti-detection
        floor — a floored attempt returns `status: "skipped"`). Returns the check outcome.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
      responses:
        '200':
          description: The per-target check outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOutcome'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/monitors/{id}/changes:
    get:
      operationId: listMonitorChanges
      tags: [monitors]
      summary: Change + uptime history of a monitor
      description: >-
        Paginated history carrying BOTH series — content-diff `changes` and up/down + SSL
        `uptime_checks` — each paged independently against the same `limit`/`offset` window.
        `has_more` reflects whether either series has rows beyond the page.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - name: limit
          in: query
          description: Page size (clamped to 1..=500; default 100).
          schema:
            type: integer
            format: int64
            default: 100
        - name: offset
          in: query
          description: Page offset (default 0).
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: Both history series for the monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/changes/recent:
    get:
      operationId: listRecentChanges
      tags: [monitors]
      summary: Recent changes across all monitors
      description: >-
        Newest-first detected content changes across ALL monitors, enriched with the monitor
        URL, selector name and a truncated diff snippet. **Returns a bare JSON array.**
        Uptime samples are not included.
      parameters:
        - name: limit
          in: query
          description: Max entries (clamped to 1..=50; default 10).
          schema:
            type: integer
            format: int64
            default: 10
      responses:
        '200':
          description: Bare array of enriched recent changes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentChange'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------ selectors ---
  /v1/monitors/{id}/selectors:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      operationId: listSelectors
      tags: [selectors]
      summary: List a monitor's selectors
      description: >-
        The monitor's content selectors (all, or `?enabled_only=true`). **Returns a bare
        JSON array** (capped at 500 rows).
      parameters:
        - name: enabled_only
          in: query
          description: Only selectors with `enabled = 1`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Bare array of selectors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Selector'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createSelector
      tags: [selectors]
      summary: Add a selector to a monitor
      description: >-
        Requires a non-empty `selector`; `name` defaults to the selector string. The
        monitor id comes from the path, not the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectorCreate'
      responses:
        '200':
          description: The created selector row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/monitors/{id}/selectors/{selector_id}:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - $ref: '#/components/parameters/SelectorId'
    get:
      operationId: getSelector
      tags: [selectors]
      summary: Get one selector
      description: >-
        One selector. A valid selector id under the wrong monitor is a 404 (ownership is
        enforced on every selector-scoped route).
      responses:
        '200':
          description: The selector row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selector'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSelector
      tags: [selectors]
      summary: Update a selector
      description: Partial update; returns the refreshed row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectorUpdate'
      responses:
        '200':
          description: The refreshed selector row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selector'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSelector
      tags: [selectors]
      summary: Delete a selector
      description: Hard-delete (cascades to its extractors).
      responses:
        '200':
          description: Deletion acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, selector_id]
                properties:
                  deleted:
                    type: boolean
                  selector_id:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/monitors/{id}/selectors/{selector_id}/toggle:
    post:
      operationId: toggleSelector
      tags: [selectors]
      summary: Toggle a selector's enabled flag
      description: Flips `enabled` and returns the new state.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/SelectorId'
      responses:
        '200':
          description: The new enabled state.
          content:
            application/json:
              schema:
                type: object
                required: [selector_id, enabled]
                properties:
                  selector_id:
                    type: integer
                    format: int64
                  enabled:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/monitors/{id}/selectors/{selector_id}/test:
    post:
      operationId: testSelector
      tags: [selectors]
      summary: Probe a selector against the live page
      description: >-
        Fetches the page now and reports what this selector resolves to, without persisting
        anything. Explicit user action — skips the scheduler's anti-detection floor.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/SelectorId'
      responses:
        '200':
          description: The live probe result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectorProbe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/monitors/{id}/selectors/{selector_id}/set-baseline:
    post:
      operationId: setSelectorBaseline
      tags: [selectors]
      summary: Capture the selector's baseline
      description: Captures this selector's baseline from a fresh live fetch.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/SelectorId'
      responses:
        '200':
          description: The probe used to (re)seed the baseline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectorProbe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/monitors/{id}/selectors/{selector_id}/clear-baseline:
    post:
      operationId: clearSelectorBaseline
      tags: [selectors]
      summary: Clear the stored baseline
      description: Drops the stored baseline so the next check re-seeds it.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/SelectorId'
      responses:
        '200':
          description: Baseline cleared.
          content:
            application/json:
              schema:
                type: object
                required: [selector_id, cleared]
                properties:
                  selector_id:
                    type: integer
                    format: int64
                  cleared:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------- extractors ---
  /v1/selectors/{selector_id}/extractors:
    get:
      operationId: listExtractors
      tags: [extractors]
      summary: List a selector's extractors
      description: >-
        The selector's field extractors (all, or `?enabled_only=true`). **Returns a bare
        JSON array.**
      parameters:
        - $ref: '#/components/parameters/SelectorId'
        - name: enabled_only
          in: query
          description: Only extractors with `enabled = 1`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Bare array of extractors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Extractor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/extractors:
    post:
      operationId: createExtractor
      tags: [extractors]
      summary: Create an extractor
      description: >-
        Creates an extractor under an existing selector (`target_selector_id` in the body).
        Requires a non-empty `output_name`; `name` defaults to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractorCreate'
      responses:
        '200':
          description: The created extractor row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extractor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/extractors/{extractor_id}:
    parameters:
      - $ref: '#/components/parameters/ExtractorId'
    get:
      operationId: getExtractor
      tags: [extractors]
      summary: Get one extractor
      description: One extractor row or 404.
      responses:
        '200':
          description: The extractor row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extractor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateExtractor
      tags: [extractors]
      summary: Update an extractor
      description: Partial update; returns the refreshed row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractorUpdate'
      responses:
        '200':
          description: The refreshed extractor row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extractor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteExtractor
      tags: [extractors]
      summary: Delete an extractor
      description: Hard-delete.
      responses:
        '200':
          description: Deletion acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, extractor_id]
                properties:
                  deleted:
                    type: boolean
                  extractor_id:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/extractors/{extractor_id}/toggle:
    patch:
      operationId: toggleExtractor
      tags: [extractors]
      summary: Toggle an extractor's enabled flag
      description: >-
        Flips `enabled` and returns the refreshed extractor row. Note this route is a
        **PATCH** (unlike the selector toggle, which is a POST).
      parameters:
        - $ref: '#/components/parameters/ExtractorId'
      responses:
        '200':
          description: The refreshed extractor row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extractor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/extractors/{extractor_id}/test:
    post:
      operationId: testExtractor
      tags: [extractors]
      summary: Test a saved extractor
      description: Runs the SAVED extractor over caller-supplied content and returns the value.
      parameters:
        - $ref: '#/components/parameters/ExtractorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractorTestRequest'
      responses:
        '200':
          description: The extraction result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractorTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------- automations ---
  /v1/automations:
    get:
      operationId: listAutomations
      tags: [automations]
      summary: List automations
      description: >-
        Newest-first automation list. **Returns a bare JSON array.** JSON-TEXT columns are
        parsed on output: `conditions` is an object, `actions` an array, `blocks` an array
        or null.
      parameters:
        - name: limit
          in: query
          description: Page size (clamped to 1..=500; default 100).
          schema:
            type: integer
            format: int64
            default: 100
      responses:
        '200':
          description: Bare array of automations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Automation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAutomation
      tags: [automations]
      summary: Create an automation
      description: >-
        Requires a non-empty `name`; schema defaults fill `event_type` / `enabled` /
        `conditions` / `actions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationCreate'
      responses:
        '200':
          description: The created automation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/automations/{id}:
    parameters:
      - $ref: '#/components/parameters/AutomationId'
    get:
      operationId: getAutomation
      tags: [automations]
      summary: Get one automation
      description: One automation or 404.
      responses:
        '200':
          description: The automation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAutomation
      tags: [automations]
      summary: Update an automation
      description: Partial update (COALESCE); returns the refreshed row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationUpdate'
      responses:
        '200':
          description: The refreshed automation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAutomation
      tags: [automations]
      summary: Delete an automation
      description: Hard-delete (executions cascade via FK).
      responses:
        '200':
          description: Deletion acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/automations/{id}/enable:
    post:
      operationId: enableAutomation
      tags: [automations]
      summary: Enable / disable an automation
      description: >-
        Sets the `enabled` flag. The body is optional — an absent or empty body defaults to
        enabling. Returns the refreshed automation.
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationEnableRequest'
      responses:
        '200':
          description: The refreshed automation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/automations/{id}/run:
    post:
      operationId: runAutomation
      tags: [automations]
      summary: Fire an automation now
      description: >-
        Manual trigger — walks the automation's block tree (conditions / branches / actions)
        and returns the execution outcome, including any `return_data` in `results`. When a
        status-gated event has no triggering context on a manual run, the response is
        `{status: "skipped", reason: ...}` instead.
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationRunRequest'
      responses:
        '200':
          description: Execution outcome (executed or skipped).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRunResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------- personas ---
  /v1/personas:
    get:
      operationId: listPersonas
      tags: [personas]
      summary: List personas
      description: >-
        Newest-first persona list in the `{data, count}` envelope. Secrets collapse to
        `has_*` booleans and `linked_secrets` NAMES; no encrypted column or plaintext value
        ever appears. `?domain=` keeps personas with no domain, the same domain, or a parent
        domain of the requested host (suffix semantics).
      parameters:
        - name: limit
          in: query
          description: Page size (clamped to 1..=500; default 100).
          schema:
            type: integer
            format: int64
            default: 100
        - name: domain
          in: query
          description: Suggest-by-domain filter (suffix match, case-insensitive).
          schema:
            type: string
      responses:
        '200':
          description: Persona page in the `{data, count}` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPersona
      tags: [personas]
      summary: Create a persona
      description: >-
        Creates a persona from a plaintext payload; the handler seals `password`,
        `extra_login_fields`, `totp_seed` and `proxy_*` into row-bound encrypted blobs.
        Requires a unique non-empty `name`. Setting a proxy requires
        `proxy_lawful_use_ack: true`. Returns 423 while the vault app-lock is locked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaWrite'
      responses:
        '200':
          description: The created persona (shaped; secrets reduced to has_* flags).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/VaultLocked'

  /v1/personas/{id}:
    parameters:
      - $ref: '#/components/parameters/PersonaId'
    get:
      operationId: getPersona
      tags: [personas]
      summary: Get one persona
      description: One shaped persona or 404.
      responses:
        '200':
          description: The persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updatePersona
      tags: [personas]
      summary: Update a persona
      description: >-
        Partial update with cloud replace semantics on secrets: sending `password` /
        `extra_login_fields` replaces the whole stored credential set; an empty `totp_seed`
        or `proxy_server` clears that blob. Returns 423 while the vault app-lock is locked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaWrite'
      responses:
        '200':
          description: The refreshed persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/VaultLocked'
    delete:
      operationId: deletePersona
      tags: [personas]
      summary: Delete a persona
      description: Hard-delete.
      responses:
        '200':
          description: Deletion acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: integer
                    format: int64
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/personas/{id}/runs:
    get:
      operationId: listPersonaRuns
      tags: [personas]
      summary: Recent runs that acted as this persona
      description: >-
        Runs of the workflows whose `default_persona_id` is this persona, newest first, in
        the `{data, count}` envelope.
      parameters:
        - $ref: '#/components/parameters/PersonaId'
        - name: limit
          in: query
          description: Max entries (default 20).
          schema:
            type: integer
            format: int64
            default: 20
      responses:
        '200':
          description: Persona run page in the `{data, count}` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaRunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/personas/validate-totp:
    post:
      operationId: validateTotp
      tags: [personas]
      summary: Validate a TOTP seed
      description: >-
        Confirms a pasted seed is well-formed base32 and (optionally) that it reproduces a
        code the user just saw (one time-step of clock skew tolerated). The seed and code
        are never stored or logged. `matches_code` is `null` when no code was supplied or
        the seed is invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTotpRequest'
      responses:
        '200':
          description: Validation verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTotpResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/personas/{id}/test-2fa:
    post:
      operationId: testPersona2fa
      tags: [personas]
      summary: Smoke-test the persona's 2FA
      description: >-
        Confirms the persona can mint a 2FA value — the code itself is NEVER returned. TOTP
        mints fully on-device; email/SMS OTP reading is a cloud capability and answers with
        a 400 explaining the cloud gate. Returns 423 while the vault app-lock is locked.
      parameters:
        - $ref: '#/components/parameters/PersonaId'
      responses:
        '200':
          description: The 2FA test verdict (no code included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test2faResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/VaultLocked'

  # --------------------------------------------------------------- secrets ---
  /v1/secrets:
    get:
      operationId: listSecrets
      tags: [secrets]
      summary: List secrets (metadata only)
      description: >-
        Newest-first secret metadata in the `{data, count}` envelope. Ciphertext and
        plaintext values are never included. Returns 423 while the vault app-lock is locked.
      parameters:
        - name: limit
          in: query
          description: Page size (clamped to 1..=500; default 100).
          schema:
            type: integer
            format: int64
            default: 100
        - name: search
          in: query
          description: Case-insensitive substring match on the secret name.
          schema:
            type: string
        - name: category
          in: query
          description: Restrict to a single category (e.g. `credentials`, `card`, `api_keys`).
          schema:
            type: string
      responses:
        '200':
          description: Secret metadata page in the `{data, count}` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/VaultLocked'
    post:
      operationId: createSecret
      tags: [secrets]
      summary: Create a secret
      description: >-
        Creates a single-value secret (`value`), a credential pair (`username` +
        `password`), or a card (`card` object with at least `number` and `expiry`). The
        plaintext is sealed handler-side; the response is metadata only. A duplicate name is
        a 400. Returns 423 while the vault app-lock is locked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
      responses:
        '200':
          description: The created secret's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/VaultLocked'

  /v1/secrets/{key}:
    parameters:
      - $ref: '#/components/parameters/SecretKey'
    get:
      operationId: getSecret
      tags: [secrets]
      summary: Get one secret's metadata
      description: >-
        Metadata ONLY — the value is never returned over the API. Returns 423 while the
        vault app-lock is locked.
      responses:
        '200':
          description: The secret's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/VaultLocked'
    delete:
      operationId: deleteSecret
      tags: [secrets]
      summary: Delete a secret
      description: Hard-delete by key. Returns 423 while the vault app-lock is locked.
      responses:
        '200':
          description: Deletion acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [key, deleted]
                properties:
                  key:
                    type: string
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/VaultLocked'

  # ----------------------------------------------------------------- vault ---
  /v1/vault/status:
    get:
      operationId: getVaultStatus
      tags: [vault]
      summary: App-lock status
      description: 'Non-secret lock snapshot: `{enabled, locked, idle_timeout_secs}`.'
      responses:
        '200':
          description: Lock status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/vault/lock:
    post:
      operationId: lockVault
      tags: [vault]
      summary: Lock the vault now
      description: Relocks the vault immediately. Idempotent (a disabled lock is a no-op success).
      responses:
        '200':
          description: Locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultOk'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/vault/unlock:
    post:
      operationId: unlockVault
      tags: [vault]
      summary: Unlock the vault
      description: >-
        Unlocks with the passphrase (verified by Argon2id re-derivation and constant-time
        comparison). A wrong passphrase is a 401; a disabled lock is a no-op success. The
        passphrase is consumed handler-side and never logged, echoed, or persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultUnlockRequest'
      responses:
        '200':
          description: Unlocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultOk'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ----------------------------------------------------------------- files ---
  /v1/files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List file handles
      description: >-
        Newest-first live (not soft-deleted) file handles in the `{data, count}` envelope.
      parameters:
        - name: limit
          in: query
          description: Page size (clamped to 1..=500; default 100).
          schema:
            type: integer
            format: int64
            default: 100
        - name: source
          in: query
          description: Optional source filter.
          schema:
            type: string
            enum: [upload, api, workflow_output]
      responses:
        '200':
          description: File-handle page in the `{data, count}` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload a file (multipart)
      description: >-
        Multipart upload. The first part carrying a filename (or named `file`) is the
        content; an optional `source` text part overrides the default `upload` source.
        Bytes are encrypted at rest; uploads over 50 MiB are rejected with a 400.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file content part (any field name with a filename is accepted).
                source:
                  type: string
                  enum: [upload, api, workflow_output]
                  description: Optional source override (defaults to `upload`).
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: The new file handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/files/from-data:
    post:
      operationId: createFileFromData
      tags: [files]
      summary: Export workflow data into a file
      description: >-
        Exports a workflow's extracted data (with the same meta/secret redaction the Data
        surface applies) into an encrypted-at-rest stored file with
        `source = "workflow_output"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileFromDataRequest'
      responses:
        '200':
          description: The new file handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/files/{id}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      operationId: getFile
      tags: [files]
      summary: Get one file handle
      description: One live file's metadata (soft-deleted handles read as absent).
      responses:
        '200':
          description: The file handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file
      description: >-
        Soft-delete (status becomes `deleted`); on-disk bytes are reclaimed by storage GC.
      responses:
        '200':
          description: Deletion acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/files/{id}/content:
    get:
      operationId: downloadFileContent
      tags: [files]
      summary: Download file bytes
      description: >-
        Decrypts and streams the handle's bytes with the recorded content type and an
        `attachment` Content-Disposition carrying the original filename.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: >-
            The raw file bytes. The Content-Type is the stored content type of the file
            (documented here as `application/octet-stream` for codegen purposes).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------ data ---
  /v1/data:
    get:
      operationId: listDataWorkflows
      tags: [data]
      summary: Data-explorer workflow picker
      description: >-
        Every workflow that has produced extracted data in a SUCCESSFUL run, with a
        contributing-run count, last-data timestamp and a small `last_delta` summary
        (null for large or single-snapshot datasets). Sorted by most recent data first.
      responses:
        '200':
          description: Picker entries under a `workflows` key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataWorkflowsList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/workflows/{id}/data:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      operationId: getWorkflowData
      tags: [data]
      summary: Aggregated extracted-data table
      description: >-
        Aggregates the workflow's successful runs' `extracted_data` into one sortable /
        searchable table. `view=all` (default) is the flat grid; `view=latest` is the
        deduplicated current dataset (adds `identity`, `counts`, `sources`, per-row
        `lineage`); `view=run&run_id=N` is one snapshot annotated vs the previous chain
        member (adds `delta`, `removed_records`, `prev_run_id`). Lens-parameter violations
        return a FastAPI-shaped 400 body `{"detail": "..."}` (not the standard Error shape).
      parameters:
        - name: q
          in: query
          description: Global substring filter across extracted fields.
          schema: {type: string}
        - name: filter
          in: query
          description: 'Per-column legacy filter `column:substring` (repeatable).'
          schema:
            type: array
            items: {type: string}
          explode: true
        - name: filters
          in: query
          description: >-
            Structured smart filters — a JSON array of clauses, e.g.
            `[{"col":"price","op":"between","min":10,"max":50}]`.
          schema: {type: string}
        - name: sort_by
          in: query
          description: >-
            A data column or `run_at` / `status` / `duration_ms` / `run_id` (lens views also
            accept `first_seen_at` / `last_seen_at` / `versions`).
          schema: {type: string}
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          description: Page size (clamped to 1..=500; default 50).
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: include_inputs
          in: query
          description: Also surface run input values as `input.<name>` columns (view=all only).
          schema:
            type: boolean
            default: false
        - name: view
          in: query
          description: 'Lens: `latest` | `run` | `all` (default `all`).'
          schema:
            type: string
            enum: [all, latest, run]
            default: all
        - name: run_id
          in: query
          description: The snapshot to show — required when `view=run`.
          schema:
            type: integer
            format: int64
        - name: key
          in: query
          description: Explicit identity key — comma-separated field names (identity pinning echo).
          schema: {type: string}
        - name: include_missing
          in: query
          description: >-
            view=latest only. Include records missing from the newest snapshot. Parsed
            STRICTLY — only the literal string `true` enables it.
          schema: {type: string}
        - name: source
          in: query
          description: >-
            view=latest/run: only records from this originating list key (empty string
            selects untagged records).
          schema: {type: string}
      responses:
        '200':
          description: The aggregated data table (view-dependent extras included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDataTable'
        '400':
          description: >-
            Lens-parameter violation. NOTE the body is the FastAPI-parity shape
            `{"detail": "..."}`, not the standard Error object.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWorkflowData
      tags: [data]
      summary: Delete extracted-data rows
      description: >-
        Removes extracted rows from the workflow's runs. The delete set is the union of the
        explicit `records` refs and every stored version of each uid in `record_uids`. The
        run rows themselves are preserved — only their `extracted_data` is mutated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWorkflowDataRequest'
      responses:
        '200':
          description: Deletion summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowDataResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{id}/data/runs:
    get:
      operationId: listWorkflowDataRuns
      tags: [data]
      summary: Data snapshot index
      description: >-
        Every successful data-bearing run (newest first) with record count, explicit-empty
        flag and delta vs the previous chain member (null for the oldest), plus the chosen
        identity.
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - name: key
          in: query
          description: Explicit identity key — comma-separated field names.
          schema: {type: string}
      responses:
        '200':
          description: The snapshot index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRunsIndex'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{id}/data/facets:
    get:
      operationId: getWorkflowDataFacets
      tags: [data]
      summary: Per-column facets
      description: >-
        Per-column facets over the workflow's extracted data (inferred type, non-empty
        count, numeric min/max, distinct pick-list when low-cardinality). `view=latest|run`
        computes over exactly that lens's rowset and adds a `sources` envelope.
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - name: include_inputs
          in: query
          schema:
            type: boolean
            default: false
        - name: view
          in: query
          schema:
            type: string
            enum: [all, latest, run]
            default: all
        - name: run_id
          in: query
          schema:
            type: integer
            format: int64
        - name: key
          in: query
          schema: {type: string}
        - name: include_missing
          in: query
          description: Strict `true` includes missing records in the view=latest rowset.
          schema: {type: string}
        - name: source
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Facets over the (lens) rowset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFacets'
        '400':
          description: Lens-parameter violation (FastAPI-shaped `detail` body).
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{id}/data/export:
    get:
      operationId: exportWorkflowData
      tags: [data]
      summary: Export the extracted-data table
      description: >-
        Downloads the full (search/sort/filter applied, UN-paginated) table as CSV
        (`?format=csv`, default) or JSON (`?format=json`), bounded by the 1000-run scan cap.
        Lens views (`view=latest|run`) attach lineage — extra CSV columns, or a `_lineage`
        object on each JSON row. Accepts the same query parameters as the table endpoint
        (`q`, `filter`, `filters`, `sort_by`, `sort_dir`, `view`, `run_id`, `key`,
        `include_missing`, `source`) plus `format`.
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - name: format
          in: query
          description: >-
            Output shape. `csv` (default) or `json` return the tabular data;
            `markdown` and `html` render it and are CONTENT-AWARE — a crawl's
            pages (records carrying a long-form `markdown` column) export as
            readable documents, structured data as a table.
          schema:
            type: string
            enum: [csv, json, markdown, html]
            default: csv
        - name: q
          in: query
          schema: {type: string}
        - name: filter
          in: query
          schema:
            type: array
            items: {type: string}
          explode: true
        - name: filters
          in: query
          schema: {type: string}
        - name: sort_by
          in: query
          schema: {type: string}
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: view
          in: query
          schema:
            type: string
            enum: [all, latest, run]
            default: all
        - name: run_id
          in: query
          schema:
            type: integer
            format: int64
        - name: key
          in: query
          schema: {type: string}
        - name: include_missing
          in: query
          schema: {type: string}
        - name: source
          in: query
          schema: {type: string}
      responses:
        '200':
          description: The exported table as a CSV or JSON attachment.
          content:
            text/csv:
              schema:
                type: string
                description: RFC-4180 CSV; run-meta columns, data columns, then lineage columns (lens views).
            application/json:
              schema:
                type: array
                description: One object per row; lens views add a `_lineage` object per row.
                items:
                  type: object
        '400':
          description: Lens-parameter violation (FastAPI-shaped `detail` body).
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------- datasets ---
  /v1/datasets:
    get:
      operationId: listDatasets
      tags: [datasets]
      summary: The unified dataset catalogue
      description: >-
        Every data source that has accumulated extracted data, framed as a dataset:
        local data-bearing workflows plus (on a cloud-linked daemon) forwarded cloud
        crawl datasets, merged into one list. `source_type` is `crawl` for a whole-site
        crawl, otherwise `workflow`; `origin` marks where the dataset lives. Read a
        dataset's rows with `GET /v1/datasets/{id}/records`.
      responses:
        '200':
          description: Catalogue entries under a `datasets` key (NOT the `{data, count}` envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/datasets/search:
    get:
      operationId: searchDatasets
      tags: [datasets]
      summary: Global full-text search across every dataset
      description: >-
        Full-text search over every local dataset at once, backed by the SQLite FTS5
        index (not a bounded scan), so it stays fast and does not miss older data.
        Terms are space-separated, ANDed, case-insensitive and prefix-matched; a record
        must contain EVERY term. Results come back newest-first, each tagged with the
        dataset it came from and a `highlight` snippet. Extracted data covers both JSON
        fields and markdown (a crawl page is a record with a `markdown` field), so both
        are searched.


        A non-json `format` renders the matches as TEXT instead of the JSON envelope —
        the per-result `dataset` tag and `highlight` snippet exist only in the JSON
        shape. `truncated` flags that the candidate-run cap (500) was hit.
      parameters:
        - $ref: '#/components/parameters/DatasetSearchQuery'
        - $ref: '#/components/parameters/DatasetSearchLimit'
        - $ref: '#/components/parameters/DatasetSearchOffset'
        - $ref: '#/components/parameters/DatasetFormat'
      responses:
        '200':
          $ref: '#/components/responses/DatasetSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/datasets/{id}:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      operationId: getDataset
      tags: [datasets]
      summary: Dataset metadata + inferred schema
      description: >-
        One dataset's metadata and inferred schema: its columns, per-column `facets`
        (inferred type, non-empty count, numeric min/max, a distinct pick-list when
        low-cardinality), total `row_count`, the `run_count` behind it, and `truncated`
        when the run-scan cap bounded the answer.


        On a cloud-linked daemon a crawl dataset that is absent locally FORWARDS to the
        cloud dataset, and the forwarded body is the cloud facets shape — which also
        carries `collections` (the nested array paths you can pivot to). A purely local
        dataset does not return `collections`.
      responses:
        '200':
          description: The dataset's metadata + schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/datasets/{id}/records:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      operationId: getDatasetRecords
      tags: [datasets]
      summary: Page through a dataset's records
      description: >-
        The dataset's records as one sortable / searchable / filterable table (the flat
        grid). A run that extracted a LIST contributes one record per item; each record
        carries the run it came from and, with `include_inputs`, that run's inputs as
        `input.<name>` columns. Identical query semantics to
        `GET /v1/workflows/{id}/data` (`view=all`).


        A non-json `format` serves THIS SAME PAGE rendered as text — pagination still
        applies, so use `/v1/datasets/{id}/export` for the whole set. markdown/html are
        content-aware: a crawl's pages render as documents, structured data as a table.


        On a cloud-linked daemon a crawl dataset absent locally forwards to the fleet and
        the response is re-keyed to this same shape.
      parameters:
        - $ref: '#/components/parameters/DatasetQ'
        - $ref: '#/components/parameters/DatasetFilter'
        - $ref: '#/components/parameters/DatasetFilters'
        - $ref: '#/components/parameters/DatasetSortBy'
        - $ref: '#/components/parameters/DatasetSortDir'
        - name: limit
          in: query
          description: Page size (clamped to 1..=500; default 50).
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - $ref: '#/components/parameters/DatasetIncludeInputs'
        - $ref: '#/components/parameters/DatasetCollection'
        - $ref: '#/components/parameters/DatasetFormat'
      responses:
        '200':
          description: >-
            The records page — the JSON envelope for `format=json` (the default), or the
            rendered page as TEXT for any other format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetRecords'
            text/csv:
              schema:
                type: string
                description: '`format=csv` — RFC-4180 CSV of this page.'
            text/markdown:
              schema:
                type: string
                description: >-
                  `format=markdown` — content-aware: documents when the records carry a
                  long-form content column, otherwise a table.
            text/html:
              schema:
                type: string
                description: >-
                  `format=html` — the markdown render as HTML. Scraped third-party content
                  is escaped and link schemes allowlisted; served `nosniff` under a
                  script-less CSP.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/datasets/{id}/export:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      operationId: exportDataset
      tags: [datasets]
      summary: Download a dataset's full records
      description: >-
        Downloads the dataset's full (search / sort / filter applied, UN-paginated)
        records, bounded by the run-scan cap, framed as an attachment. The bytes are
        identical to `GET /v1/workflows/{id}/data/export`, which this delegates to.


        NOTE the default here is `csv`, NOT `json` — the one place the dataset surface
        departs from the `format=json` default of every other dataset read. markdown/html
        are content-aware: a crawl's pages download as readable documents, structured data
        as a table.
      parameters:
        - $ref: '#/components/parameters/DatasetExportFormat'
        - $ref: '#/components/parameters/DatasetQ'
        - $ref: '#/components/parameters/DatasetFilter'
        - $ref: '#/components/parameters/DatasetFilters'
        - $ref: '#/components/parameters/DatasetSortBy'
        - $ref: '#/components/parameters/DatasetSortDir'
        - $ref: '#/components/parameters/DatasetIncludeInputs'
        - $ref: '#/components/parameters/DatasetCollection'
      responses:
        '200':
          description: 'The exported records as a download (`Content-Disposition: attachment`).'
          content:
            text/csv:
              schema:
                type: string
                description: '`format=csv` (the default) — RFC-4180 CSV; run-meta columns then data columns.'
            application/json:
              schema:
                type: array
                description: '`format=json` — one object per record.'
                items:
                  type: object
            text/markdown:
              schema:
                type: string
                description: '`format=markdown` — content-aware documents or a table.'
            text/html:
              schema:
                type: string
                description: '`format=html` — the markdown render as safe HTML.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/datasets/{id}/search:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      operationId: searchDataset
      tags: [datasets]
      summary: Full-text search within one dataset
      description: >-
        The same full-text find as `GET /v1/datasets/search` — same terms semantics, same
        ranking, same result shape — scoped to this dataset's id.


        On a cloud-linked daemon a crawl dataset absent locally forwards the query to the
        fleet's data table; that forwarded body is the cloud table shape, and `offset` is
        not forwarded.
      parameters:
        - $ref: '#/components/parameters/DatasetSearchQuery'
        - $ref: '#/components/parameters/DatasetSearchLimit'
        - $ref: '#/components/parameters/DatasetSearchOffset'
        - $ref: '#/components/parameters/DatasetFormat'
      responses:
        '200':
          $ref: '#/components/responses/DatasetSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------- crawl ---
  /v1/crawl:
    get:
      operationId: listCrawls
      tags: [crawl]
      summary: List crawls
      description: >-
        Newest-first Dragnet crawl list. Does NOT use the `{data, count}` envelope — it
        returns `{crawls: [CrawlJob…]}` (mirrors the `/v1/data` non-Page shape). Each item
        is the `to_view` projection (parsed `include_paths`/`exclude_paths` arrays, the
        `Dragnet` brand, the `data_workflow_id` alias and `is_terminal`).
      parameters:
        - name: limit
          in: query
          description: Page size (clamped to 1..=500; default 50).
          schema:
            type: integer
            format: int64
            default: 50
      responses:
        '200':
          description: Crawl list under a `crawls` key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: startCrawl
      tags: [crawl]
      summary: Start a crawl
      description: >-
        Queues a Dragnet whole-site crawl from a seed `url`, fanning it across a bounded
        in-process worker pool; extracted pages aggregate under a synthetic per-crawl
        workflow (read back via `GET /v1/workflows/{data_workflow_id}/data`). An empty
        `url` is a 400. Returns the queued crawl view.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrawlStartRequest'
      responses:
        '200':
          description: The queued crawl view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/crawl/{id}:
    parameters:
      - $ref: '#/components/parameters/CrawlId'
    get:
      operationId: getCrawl
      tags: [crawl]
      summary: Get one crawl
      description: One crawl view (with live progress counters) or 404.
      responses:
        '200':
          description: The crawl view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/crawl/{id}/cancel:
    post:
      operationId: cancelCrawl
      tags: [crawl]
      summary: Request cancellation of a crawl
      description: >-
        Signals the crawl to stop. Always returns the refreshed crawl view (never a 409)
        plus `cancel_requested_now` — `true` iff this call flipped a live crawl into
        `stopping`, `false` when it was already terminal.
      parameters:
        - $ref: '#/components/parameters/CrawlId'
      responses:
        '200':
          description: The refreshed crawl view plus `cancel_requested_now`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlCancelResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------- cloud ---
  # These paths target the CLOUD server, not the daemon — note the per-path `servers` override
  # and the two credential tiers (Bearer key → /api/crawl/*, else X-Writ-Client-Id → /v1/keyless/*).
  /api/crawl/scrape:
    servers:
      - url: https://api.usewrit.app
        description: Writ Cloud. Override with WRIT_CLOUD_URL.
    post:
      operationId: cloudScrapeMetered
      tags: [cloud]
      summary: Scrape one page (metered)
      description: >-
        METERED single-page scrape to clean markdown. Requires an API key (`Authorization: Bearer`);
        billed one Dragnet page against the plan allotment (PAYG beyond it). The authed twin of
        `POST /v1/keyless/scrape`. 402 `insufficient_credits` when the allotment is spent and the
        wallet can't cover it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudScrapeRequest'
      responses:
        '200':
          description: The scraped page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Crawl-page allotment spent and wallet can't cover the call.
        '422':
          description: The page could not be fetched.

  /v1/keyless/scrape:
    servers:
      - url: https://api.usewrit.app
        description: Writ Cloud. Override with WRIT_CLOUD_URL.
    post:
      operationId: cloudScrapeKeyless
      tags: [cloud]
      summary: Scrape one page (keyless)
      description: >-
        KEYLESS single-page scrape — no API key. Identify the install with an `X-Writ-Client-Id`
        header; the daily allowance (requests/day AND pages/day) is capped per device and per IP.
        429 `keyless_rate_limited` when the allowance is exhausted.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudScrapeRequest'
      responses:
        '200':
          description: The scraped page, with the remaining `quota`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeResult'
        '400':
          description: Missing `X-Writ-Client-Id`.
        '429':
          description: Keyless daily allowance exhausted.

  /v1/keyless/map:
    servers:
      - url: https://api.usewrit.app
        description: Writ Cloud. Override with WRIT_CLOUD_URL.
    post:
      operationId: cloudMapKeyless
      tags: [cloud]
      summary: Map a site's URLs (keyless)
      description: >-
        KEYLESS site map — sitemap + shallow harvest, ranked by an optional `search`. Costs a
        request but no pages. Same `X-Writ-Client-Id` daily caps as keyless scrape. The metered
        twin is `POST /api/crawl/map`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudMapRequest'
      responses:
        '200':
          description: Ranked URLs with the remaining `quota`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapResult'
        '400':
          description: Missing `X-Writ-Client-Id`.
        '429':
          description: Keyless daily allowance exhausted.

  /v1/keyless/quota:
    servers:
      - url: https://api.usewrit.app
        description: Writ Cloud. Override with WRIT_CLOUD_URL.
    get:
      operationId: cloudKeylessQuota
      tags: [cloud]
      summary: Remaining keyless allowance
      description: Report this install's remaining keyless daily allowance without spending any of it.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: The remaining allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeylessQuota'
        '400':
          description: Missing `X-Writ-Client-Id`.

  # ------------------------------------------------------------------ keys ---
  /v1/keys:
    get:
      operationId: listApiKeys
      tags: [keys]
      summary: List API keys
      description: >-
        Newest-first key records in the `{data, count}` envelope. The `key_hash` column is
        never serialized; only the display `prefix` identifies a key. Requires the
        full-access `wlt_` token (`manage` scope).
      parameters:
        - name: limit
          in: query
          description: Page size (clamped to 1..=200; default 100).
          schema:
            type: integer
            format: int64
            default: 100
      responses:
        '200':
          description: Key-record page in the `{data, count}` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createApiKey
      tags: [keys]
      summary: Mint a scoped API key
      description: >-
        Mints a new `wlk_` key. The plaintext `key` appears ONLY in this response — the
        daemon stores just the prefix and a sha256 hash, so it can never be recovered later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '200':
          description: The key record, including the one-time plaintext `key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    get:
      operationId: getApiKey
      tags: [keys]
      summary: Get one key record
      description: One key record (never the hash or plaintext) or 404.
      responses:
        '200':
          description: The key record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteApiKey
      tags: [keys]
      summary: Delete a key record
      description: Hard-delete; the key stops authenticating immediately.
      responses:
        '200':
          description: Deletion acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: integer
                    format: int64
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------- ws-ticket ---
  /v1/ws-ticket:
    post:
      operationId: createWsTicket
      tags: [ws-ticket]
      summary: Mint a single-use WebSocket ticket
      description: >-
        Mints a short-lived, single-use, route-scoped `wtk_…` ticket for the loopback
        WebSocket endpoints (browsers cannot set an Authorization header on a WS). Open the
        socket with `?ticket=<wtk_…>`. `route: "ai-preview"` requires a `channel`;
        `route: "record"` must not carry one (it is ignored). Over-minting is refused with
        429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WsTicketRequest'
      responses:
        '200':
          description: The minted ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Ticket-minting rate limit hit — retry after the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Every route (including `/v1/agent` and `/v1/health`) requires
        `Authorization: Bearer <token>`. Token families:

        - `wlt_…` — the runtime token from `runtime.json` (full access, used by the desktop
          UI and SDK discovery).
        - `wlk_…` — a scoped API key minted via `POST /v1/keys` (CSV scopes `read|run|admin`;
          `/v1/keys` itself requires the full-access token).
        - `wlo_…` — an OAuth 2.1 access token from the daemon's local authorization server
          (`run` scope).

        Treat the token as an opaque string. The daemon additionally enforces a loopback
        Origin/Host DNS-rebind guard.

  parameters:
    WorkflowId:
      name: id
      in: path
      required: true
      description: Workflow row id.
      schema:
        type: integer
        format: int64
    RunId:
      name: id
      in: path
      required: true
      description: >-
        Numeric run row id (for feed items with a composite string id like `workflow-3`,
        this is the part after the last dash).
      schema:
        type: integer
        format: int64
    MonitorId:
      name: id
      in: path
      required: true
      description: Monitor (target) row id.
      schema:
        type: integer
        format: int64
    SelectorId:
      name: selector_id
      in: path
      required: true
      description: Selector row id.
      schema:
        type: integer
        format: int64
    ExtractorId:
      name: extractor_id
      in: path
      required: true
      description: Extractor row id.
      schema:
        type: integer
        format: int64
    AutomationId:
      name: id
      in: path
      required: true
      description: Automation row id.
      schema:
        type: integer
        format: int64
    PersonaId:
      name: id
      in: path
      required: true
      description: Persona row id.
      schema:
        type: integer
        format: int64
    SecretKey:
      name: key
      in: path
      required: true
      description: The secret's unique text key (its name).
      schema:
        type: string
    FileId:
      name: id
      in: path
      required: true
      description: File handle id (`file_<hex>`).
      schema:
        type: string
    KeyId:
      name: id
      in: path
      required: true
      description: API-key record id.
      schema:
        type: integer
        format: int64
    CrawlId:
      name: id
      in: path
      required: true
      description: Crawl job row id.
      schema:
        type: integer
        format: int64
    DatasetId:
      name: id
      in: path
      required: true
      description: >-
        Dataset id — the same id as the workflow/crawl that produced the data
        (`GET /v1/datasets` lists them).
      schema:
        type: integer
        format: int64
    DatasetFormat:
      name: format
      in: query
      description: >-
        Output shape. `json` (the default) returns the documented JSON envelope; ANY other
        value returns rendered TEXT instead — `csv` as RFC-4180 CSV, and `markdown`/`html`
        CONTENT-AWARE: a dataset whose records carry a long-form content column (a crawl's
        pages carry `markdown`) renders as DOCUMENTS — one section per record, heading +
        source link + body — while anything else renders as a TABLE mirroring the CSV
        columns. An unknown value is a 400, never a silent fall back to JSON.
      schema:
        type: string
        enum: [json, csv, markdown, html]
        default: json
    DatasetExportFormat:
      name: format
      in: query
      description: >-
        Output shape, defaulting to `csv` on this route (every other dataset read defaults
        to `json`). `csv`/`json` return the tabular records; `markdown`/`html` render them
        and are CONTENT-AWARE — a crawl's pages export as readable documents, structured
        data as a table. An unknown value is a 400.
      schema:
        type: string
        enum: [csv, json, markdown, html]
        default: csv
    DatasetQ:
      name: q
      in: query
      description: Global substring filter across extracted fields (and inputs, when included).
      schema: {type: string}
    DatasetFilter:
      name: filter
      in: query
      description: 'Per-column filter `column:substring` (repeatable).'
      schema:
        type: array
        items: {type: string}
      explode: true
    DatasetFilters:
      name: filters
      in: query
      description: >-
        Structured smart filters — a JSON array of clauses, e.g.
        `[{"col":"price","op":"between","min":10,"max":50}]`.
      schema: {type: string}
    DatasetSortBy:
      name: sort_by
      in: query
      description: A data column, `input.<name>`, or `run_at` / `status` / `duration_ms` / `run_id`.
      schema: {type: string}
    DatasetSortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    DatasetIncludeInputs:
      name: include_inputs
      in: query
      description: Also surface run input values as `input.<name>` columns.
      schema:
        type: boolean
        default: false
    DatasetCollection:
      name: collection
      in: query
      description: >-
        Pivot to a nested array path (e.g. `posts.items`), one row per item. ACCEPTED BUT
        IGNORED by the daemon — nested collections are scoped client-side by the desktop
        app, and only the cloud `/api/v1/datasets/*` twin pivots server-side. Passing it
        here changes nothing rather than erroring.
      schema: {type: string}
    DatasetSearchQuery:
      name: q
      in: query
      required: true
      description: >-
        Space-separated keywords — ANDed, case-insensitive, prefix-matched; a record must
        contain EVERY term. A query with no usable terms returns an empty result set
        rather than an error.
      schema: {type: string}
    DatasetSearchLimit:
      name: limit
      in: query
      description: Page size over the ranked hits (clamped to 1..=200; default 50).
      schema:
        type: integer
        default: 50
    DatasetSearchOffset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    ClientId:
      name: X-Writ-Client-Id
      in: header
      required: true
      description: >-
        Stable per-install device id the keyless daily quota is attributed to. The Writ SDKs and
        desktop app mint + persist this at `~/.writ/client_id` and send it automatically.
      schema:
        type: string
        maxLength: 128

  responses:
    Unauthorized:
      description: Missing/invalid bearer token, or the Origin/Host guard rejected the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but the credential lacks the scope for this route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: >-
        Invalid input. Domain validation errors use the JSON Error shape; axum
        body-deserialize rejections are `text/plain` with a bare message (e.g.
        `Failed to deserialize the JSON body into the target type: missing field 'url'`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
    VaultLocked:
      description: The vault app-lock is engaged and locked (HTTP 423). Unlock via `POST /v1/vault/unlock`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DatasetSearchResponse:
      description: >-
        The matches — the JSON envelope for `format=json` (the default), or the matches
        rendered as TEXT for any other format. The per-result `dataset` tag and `highlight`
        snippet exist only in the JSON shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DatasetSearchResult'
        text/csv:
          schema:
            type: string
            description: '`format=csv` — RFC-4180 CSV of the matched records.'
        text/markdown:
          schema:
            type: string
            description: >-
              `format=markdown` — content-aware: matched documents render as documents,
              structured matches as a table.
        text/html:
          schema:
            type: string
            description: '`format=html` — the markdown render as safe HTML.'

  schemas:
    # ------------------------------------------------------------- shared ---
    Error:
      type: object
      description: >-
        The daemon's domain error body. NOTE: some 4xx responses (axum framework
        rejections) are `text/plain` instead of this JSON shape. Certain codes attach extra
        fields (e.g. `device_capacity` adds `would_use_units_per_min` /
        `budget_units_per_min`; `captcha_required` adds `captcha_type` / `url`).
      required: [error, code]
      properties:
        error:
          type: string
          description: 'Human-readable message (e.g. `not found: workflow 999999`).'
        code:
          type: string
          description: >-
            Stable machine code: `bad_request`, `unauthorized`, `forbidden`, `not_found`,
            `vault_locked`, `too_many_requests`, `captcha_required`, `device_capacity`,
            `cloud_unreachable`, `db_error`, `io_error`, `json_error`, `internal`, …
      additionalProperties: true

    DeviceCapacityError:
      description: >-
        The 409 body for a monitor create/update that would exceed the machine's
        sustainable checks/min budget (`code: "device_capacity"`).
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            would_use_units_per_min:
              type: number
            budget_units_per_min:
              type: number

    # -------------------------------------------------------------- agent ---
    AgentStatus:
      type: object
      description: Lightweight daemon status (`GET /v1/agent`).
      required: [status, version, active_runs, encrypted, due_monitors, warm_browser]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: Daemon crate version.
        active_runs:
          type: integer
          description: Number of runs currently executing in the engine.
        encrypted:
          type: boolean
          description: Always true — the store is SQLCipher-encrypted.
        due_monitors:
          type: integer
          description: Monitors currently due per the scheduler's last tick.
        last_tick_at:
          type: [string, 'null']
          description: RFC3339 timestamp of the scheduler's last tick (null before the first tick).
        warm_browser:
          type: boolean
          description: Whether a warm browser is available right now (OR'd with live runs).

    Health:
      type: object
      description: Deep health probe (`GET /v1/health`). No secrets.
      required: [status, version, cipher_present, db_ok, keyring_ok, active_runs, scheduler, warm_browser, cloud_link]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        cipher_present:
          type: boolean
          description: SQLCipher is active on the store.
        db_ok:
          type: boolean
          description: Cipher active AND a trivial query succeeded.
        keyring_ok:
          type: boolean
          description: OS keyring reachability (reported true when the file-fallback vault is configured).
        active_runs:
          type: integer
        scheduler:
          type: object
          required: [last_tick_at, due_monitors]
          properties:
            last_tick_at:
              type: [string, 'null']
            due_monitors:
              type: integer
        warm_browser:
          type: boolean
        cloud_link:
          type: object
          description: Cloud-link reflection (always unlinked in the cloud-free OSS build).
          required: [linked, account_id]
          properties:
            linked:
              type: boolean
            account_id:
              type: [string, 'null']
              description: Opaque server-side account id when linked; null otherwise.

    # ----------------------------------------------------------- workflows ---
    Workflow:
      type: object
      description: >-
        A redacted workflow row. `credentials_encrypted` NEVER appears; instead the daemon
        computes `has_credentials`, `credential_keys` (names only), `placeholders` (the
        non-secret run-time inputs) and `has_login`. JSON-TEXT columns (`steps`,
        `raw_replay`, `form_data`, `exit_condition`, `input_rules`, `api_functions`,
        `streaming_config`, `functions`, `login_url_patterns`) are re-hydrated to real
        JSON values on output (a malformed legacy value stays a string).
      required: [id, name, workflow_type, steps, timeout_ms, retry_count, headless, fast_mode,
                 is_active, is_verified, schedule_enabled, session_persistence, relogin_max_retries,
                 http_capable, usage_count, total_run_count, total_failure_count,
                 consecutive_failures, cloud_callable, created_at,
                 has_credentials, credential_keys, placeholders, has_login]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: [string, 'null']
        workflow_type:
          type: string
          description: '`recorded` | `pre_check` | `on_change` | `api_recorded` | `streaming`.'
        steps:
          description: Recorded step array (re-hydrated JSON; a malformed legacy value stays a string).
        raw_replay:
          description: Raw replay JSON (re-hydrated) or null.
        form_data:
          description: Declared input map (re-hydrated) or null.
        exit_condition:
          description: Exit-condition JSON (re-hydrated) or null.
        input_rules:
          description: Input-rule JSON (re-hydrated) or null.
        api_functions:
          description: API-function JSON (re-hydrated) or null.
        streaming_config:
          description: Streaming-config JSON (re-hydrated) or null.
        functions:
          description: Callable-function manifest JSON (re-hydrated) or null.
        entry_url:
          type: [string, 'null']
        timeout_ms:
          type: integer
          format: int64
        retry_count:
          type: integer
          format: int64
        headless:
          type: integer
          description: 0/1 integer flag.
        fast_mode:
          type: integer
          description: 0/1 integer flag.
        is_active:
          type: integer
          description: 0/1 integer flag (always 1 — deactivation is retired).
        is_verified:
          type: integer
          description: 0/1 integer flag.
        schedule_enabled:
          type: integer
          description: 0/1 integer flag.
        schedule_interval_ms:
          type: [integer, 'null']
          format: int64
        schedule_kind:
          type: [string, 'null']
          description: '`interval` (default) | `daily` | `weekly`.'
        schedule_time:
          type: [string, 'null']
          description: '"HH:MM" local wall-clock fire time (daily/weekly).'
        schedule_days:
          type: [string, 'null']
          description: JSON array string of ISO weekday ints, 1=Mon … 7=Sun (weekly only).
        schedule_tz:
          type: [string, 'null']
          description: IANA tz name for daily/weekly (null ⇒ UTC).
        last_scheduled_at:
          type: [string, 'null']
        next_scheduled_at:
          type: [string, 'null']
        session_persistence:
          type: integer
          description: 0/1 integer flag.
        session_ttl_seconds:
          type: [integer, 'null']
          format: int64
        login_url_patterns:
          description: Login-URL pattern JSON (re-hydrated) or null.
        relogin_max_retries:
          type: integer
          format: int64
        http_capable:
          type: integer
          description: 'Browserless HTTP-lane hint: -1 unknown, 0 browser-only, 1 HTTP-proven.'
        auth_config:
          type: [string, 'null']
          description: Declarative AuthRecipe JSON as stored TEXT (not re-hydrated).
        default_persona_id:
          type: [integer, 'null']
          format: int64
        estimated_duration_ms:
          type: [integer, 'null']
          format: int64
        usage_count:
          type: integer
          format: int64
        total_run_count:
          type: integer
          format: int64
        total_failure_count:
          type: integer
          format: int64
        consecutive_failures:
          type: integer
          format: int64
        last_run_at:
          type: [string, 'null']
        last_run_status:
          type: [string, 'null']
          description: Status of the most recent run (computed; null when never run).
        last_run_duration_ms:
          type: [integer, 'null']
          format: int64
        last_run_has_extracted_data:
          type: [integer, 'null']
          description: 0/1 — whether a successful run produced a non-trivial payload (computed).
        last_failure_at:
          type: [string, 'null']
        last_failure_error:
          type: [string, 'null']
        cloud_callable:
          type: integer
          description: 0/1 integer flag.
        execution_target:
          type: [string, 'null']
          description: Run-venue pin (`local` | `cloud`); null = Auto.
        marketplace_slug:
          type: [string, 'null']
          description: Set when this row is a proxy for an installed marketplace listing.
        created_at:
          type: string
        updated_at:
          type: [string, 'null']
        has_credentials:
          type: boolean
          description: Whether a sealed credential blob exists (the blob itself is never returned).
        credential_keys:
          type: array
          description: >-
            NAMES of the stored credential map's top-level keys (values never returned).
            Degrades to [] when the vault is locked or the blob is unreadable.
          items:
            type: string
        placeholders:
          type: array
          description: The non-secret run-time inputs the Run modal renders.
          items:
            $ref: '#/components/schemas/WorkflowPlaceholder'
        has_login:
          type: boolean
          description: Deterministic "does this workflow authenticate?" heuristic.
        marketplace:
          description: >-
            GET /v1/workflows/{id} only, for marketplace PROXY rows: the install's attach
            projection (`{slug, listing_title, manifest, bindings}` — names only), or
            `{slug, missing: true}` when the install row is gone.
          type: object
          additionalProperties: true

    WorkflowPlaceholder:
      type: object
      description: One run-time input field descriptor.
      required: [key, label, field_type]
      properties:
        key:
          type: string
          description: The placeholder name (e.g. `city` or `input.city`).
        label:
          type: string
          description: Humanized label (`input.` prefix stripped, underscores → spaces).
        field_type:
          type: [string, 'null']
          description: Field-type hint (null when unknown; marketplace slots may set it).

    WorkflowList:
      type: object
      description: '`{data, count}` list envelope.'
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        count:
          type: integer
          description: Number of items in `data`.

    WorkflowCreate:
      type: object
      description: >-
        Create body (`store::workflows::NewWorkflow` + a plaintext `credentials` map sealed
        handler-side). JSON-TEXT fields accept EITHER a real JSON value (array/object) OR a
        pre-serialized JSON string. Boolean-ish 0/1 columns accept booleans or integers.
      required: [name]
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
        workflow_type:
          type: [string, 'null']
          description: '`recorded` | `pre_check` | `on_change` | `api_recorded`. Omitted ⇒ `recorded`.'
        steps:
          description: Step array (JSON value or JSON string). Omitted ⇒ `[]`.
        raw_replay:
          description: JSON value or JSON string.
        form_data:
          description: JSON value or JSON string.
        exit_condition:
          description: JSON value or JSON string.
        input_rules:
          description: JSON value or JSON string.
        api_functions:
          description: JSON value or JSON string.
        streaming_config:
          description: JSON value or JSON string.
        functions:
          description: JSON value or JSON string.
        credentials_encrypted:
          type: [string, 'null']
          description: Pre-sealed `WF1:` blob (rare; the wizard sends plaintext `credentials` instead).
        entry_url:
          type: [string, 'null']
        default_persona_id:
          type: [integer, 'null']
          format: int64
        timeout_ms:
          type: [integer, 'null']
          format: int64
          description: Omitted ⇒ schema default 30000.
        retry_count:
          type: [integer, 'null']
          format: int64
          description: Omitted ⇒ schema default 2.
        headless:
          description: Boolean or 0/1 integer. Omitted ⇒ default 1.
          type: [boolean, integer, 'null']
        fast_mode:
          description: Boolean or 0/1 integer. Omitted ⇒ default 1.
          type: [boolean, integer, 'null']
        schedule_kind:
          type: [string, 'null']
        schedule_time:
          type: [string, 'null']
        schedule_days:
          description: ISO weekday ints (weekly) — a JSON array (or JSON string).
        schedule_tz:
          type: [string, 'null']
        auth_config:
          description: Declarative AuthRecipe JSON (value or string).
        credentials:
          type: [object, 'null']
          description: >-
            PLAINTEXT `{name: value}` credential map, sealed into the row's encrypted blob
            handler-side. Never echoed back.
          additionalProperties:
            type: string

    WorkflowUpdate:
      type: object
      description: >-
        Sparse PATCH body (`store::workflows::WorkflowUpdate` + plaintext `credentials`).
        Absent fields are untouched. `is_active` is accepted but silently ignored by the
        handler.
      properties:
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
        workflow_type:
          type: [string, 'null']
        steps:
          description: JSON value or JSON string.
        raw_replay:
          description: JSON value or JSON string.
        form_data:
          description: JSON value or JSON string.
        exit_condition:
          description: JSON value or JSON string.
        input_rules:
          description: JSON value or JSON string.
        api_functions:
          description: JSON value or JSON string.
        streaming_config:
          description: JSON value or JSON string.
        functions:
          description: JSON value or JSON string.
        credentials_encrypted:
          type: [string, 'null']
        entry_url:
          type: [string, 'null']
        timeout_ms:
          type: [integer, 'null']
          format: int64
        retry_count:
          type: [integer, 'null']
          format: int64
        headless:
          type: [boolean, integer, 'null']
        fast_mode:
          type: [boolean, integer, 'null']
        is_active:
          type: [boolean, integer, 'null']
          description: Ignored — deactivation is retired; delete is the only removal.
        is_verified:
          type: [boolean, integer, 'null']
        schedule_enabled:
          type: [boolean, integer, 'null']
        schedule_interval_ms:
          type: [integer, 'null']
          format: int64
          description: Floored to the 60s scheduler minimum when set.
        schedule_kind:
          type: [string, 'null']
        schedule_time:
          type: [string, 'null']
        schedule_days:
          description: ISO weekday ints (weekly) — a JSON array (or JSON string).
        schedule_tz:
          type: [string, 'null']
        session_persistence:
          type: [boolean, integer, 'null']
        session_ttl_seconds:
          type: [integer, 'null']
          format: int64
        login_url_patterns:
          description: JSON value or JSON string.
        relogin_max_retries:
          type: [integer, 'null']
          format: int64
        default_persona_id:
          type: [integer, 'null']
          format: int64
        estimated_duration_ms:
          type: [integer, 'null']
          format: int64
        cloud_callable:
          type: [boolean, integer, 'null']
        execution_target:
          type: [string, 'null']
          description: '`local` | `cloud` | `""` to clear back to Auto.'
        credentials:
          type: [object, 'null']
          description: PLAINTEXT credential map, sealed handler-side (replaces the stored blob).
          additionalProperties:
            type: string

    WorkflowDeleteResult:
      type: object
      description: >-
        Delete acknowledgement. For a marketplace PROXY row the delete routes through the
        full uninstall and additionally carries an `uninstall` summary.
      required: [id, deleted]
      properties:
        id:
          type: integer
          format: int64
        deleted:
          type: boolean
        uninstall:
          description: Marketplace uninstall summary (proxy rows only).
          type: object
          additionalProperties: true

    RunWorkflowRequest:
      type: object
      description: Body for `POST /v1/workflows/{id}/run`.
      properties:
        inputs:
          description: 'Free-form run inputs `{NAME: value}` resolved over `{{NAME}}`/`{{input.NAME}}`.'
          type: [object, 'null']
        form_data:
          description: Alias for `inputs` (used when `inputs` is absent).
          type: [object, 'null']
        persona_id:
          type: [integer, 'null']
          format: int64
          description: Persona override for this run; wins over the workflow's pinned default.
        dry_run:
          type: boolean
          default: false
          description: Validate-only — parse the plan, execute nothing, respond 200 with the report.
        files:
          type: [object, 'null']
          description: '`{slot: file_id}` bindings of vault files to the workflow''s upload slots.'
          additionalProperties:
            type: string

    RunAccepted:
      type: object
      description: 202 response of the async run start.
      required: [run_id, status]
      properties:
        run_id:
          type: integer
          format: int64
        status:
          type: string
          const: running

    RunCompleted:
      type: object
      description: >-
        Terminal run document returned by `?wait=true`. `status` uses the same vocabulary as
        the cloud gateway so one set of words describes a run wherever it executed. A `failed`
        run is reported here with `200` — the REPORT succeeded even though the run did not.
      required: [run_id, status, done]
      properties:
        run_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [success, failed, timeout, cancelled]
        done:
          type: boolean
          const: true
        data:
          description: The run's result payload, present when it produced one.
        error:
          type: string
          description: Why the run failed. Present for non-success terminal states.
        duration_ms:
          type: integer
          format: int64

    RunStillRunning:
      type: object
      description: >-
        504 body of a `?wait=true` call whose budget expired. Nothing was lost: the run is
        in flight and both URLs address it.
      required: [run_id, status, done]
      properties:
        run_id:
          type: integer
          format: int64
        status:
          type: string
          const: running
        done:
          type: boolean
          const: false
        error:
          type: string
        status_url:
          type: string
          description: Read the outcome once terminal.
        events_url:
          type: string
          description: Live SSE stream for this run.

    DryRunReport:
      type: object
      description: >-
        Validate-only report (`dry_run: true`). Nothing was executed; secret NAMES may
        appear but never values.
      required: [dry_run, workflow_id, step_count, steps, required_secrets, provided_inputs]
      properties:
        dry_run:
          type: boolean
          const: true
        workflow_id:
          type: integer
          format: int64
        step_count:
          type: integer
        steps:
          type: array
          items:
            $ref: '#/components/schemas/DryRunStep'
        required_secrets:
          type: array
          description: Distinct secret KEY NAMES the plan references.
          items:
            type: string
        provided_inputs:
          type: array
          description: Names of the inputs supplied in the request.
          items:
            type: string
        entry_url:
          type: [string, 'null']

    DryRunStep:
      type: object
      required: [index, type, enabled, references_secret]
      properties:
        index:
          type: integer
        type:
          type: string
          description: The recorded step kind (e.g. `navigate`, `fill`, `click`).
        enabled:
          type: boolean
        references_secret:
          type: boolean
          description: Whether the step text references any `{{secret:…}}` placeholder.

    WorkflowCancelAccepted:
      type: object
      description: 202 body of `POST /v1/workflows/{id}/cancel`.
      required: [id, run_id, status]
      properties:
        id:
          type: integer
          format: int64
          description: The workflow id.
        run_id:
          type: integer
          format: int64
          description: The live run that was signalled.
        status:
          type: string
          const: cancel_requested

    WorkflowCancelConflict:
      type: object
      description: >-
        409 body of `POST /v1/workflows/{id}/cancel` — no in-flight cancellable run.
        `run_id` is present only when a run row said `running` but the engine held no live
        handle.
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
        status:
          type: string
          const: not_running

    WorkflowSession:
      type: object
      description: >-
        Browserless HTTP-lane session status. When no session row exists, only
        `workflow_id` and `has_session: false` are present.
      required: [workflow_id, has_session]
      properties:
        workflow_id:
          type: integer
          format: int64
        has_session:
          type: boolean
        engine:
          type: [string, 'null']
          description: The lane that captured the session (present only when a session row exists).
        expires_at:
          type: [string, 'null']
          description: Session capture time surfaced as-is (the daemon applies its TTL internally).
        last_used_at:
          type: [string, 'null']

    # ---------------------------------------------------------------- runs ---
    RunFeedItem:
      type: object
      description: >-
        Enriched run-feed projection (`api/v1/runs.rs::RunFeedItem`). `id` is a COMPOSITE
        STRING `"<run_type>-<row_id>"` (e.g. `"workflow-3"`); the numeric id for
        get/cancel/events is the part after the last dash.
      required: [id, run_type, entity_id, entity_name, status, started_at, finished_at,
                 duration_ms, trigger_source, error, detail_url_hint, data_url_hint,
                 rows_extracted, change_detected]
      properties:
        id:
          type: string
          description: 'Composite feed id: `"<run_type>-<row_id>"`.'
        run_type:
          type: string
          enum: [workflow, check, automation]
        entity_id:
          type: [integer, 'null']
          format: int64
          description: The associated workflow / target / automation id, per `run_type`.
        entity_name:
          type: [string, 'null']
          description: Resolved entity name (workflow runs; `Run <id>` fallback).
        status:
          type: string
          description: >-
            Open string enum. Known values: `running`, `success`, `failed`, `cancelled`,
            `timeout`, `captcha_required`, `twofa_required`, `interrupted`.
        started_at:
          type: [string, 'null']
          description: RFC3339; falls back to the row's created time.
        finished_at:
          type: [string, 'null']
        duration_ms:
          type: [integer, 'null']
          format: int64
        trigger_source:
          type: [string, 'null']
          description: The run's trigger type (`manual`, `schedule`, …).
        error:
          type: [string, 'null']
          description: The failure message for failed runs.
        detail_url_hint:
          type: [string, 'null']
          description: Frontend deep-link to the owning entity (e.g. `/workflows/3`).
        data_url_hint:
          type: [string, 'null']
          description: >-
            Deep-link to the Data view — present only for successful, row-producing,
            non-streaming workflow runs.
        rows_extracted:
          type: [integer, 'null']
          format: int64
          description: Workflow runs only — extracted record count; null for other types.
        change_detected:
          type: [boolean, 'null']
          description: Check runs only — whether the check detected a change; null otherwise.
        engine:
          type: string
          description: >-
            Which lane ran this (`http` | `browser` | `hybrid`), from the result payload.
            OMITTED (not null) for non-workflow runs and older results.

    RunList:
      type: object
      description: '`{data, count, total}` list envelope (runs only).'
      required: [data, count, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RunFeedItem'
        count:
          type: integer
          description: Number of items in this page.
        total:
          type: integer
          description: Post-filter total before pagination.

    RunResults:
      type: object
      description: Raw run result envelope.
      required: [run_id, status, result]
      properties:
        run_id:
          type: integer
          format: int64
        status:
          type: string
        result:
          description: The parsed `result_data` payload; null when none exists.

    RunData:
      type: object
      description: >-
        Extracted-data envelope (JSON lane). `data` is the `extracted_data` value of the
        result payload, falling back to the whole result.
      required: [run_id, status, data]
      properties:
        run_id:
          type: integer
          format: int64
        status:
          type: string
        data:
          description: The extracted data (any JSON value; null when none).

    RunCancelAccepted:
      type: object
      description: 202 body of `POST /v1/runs/{id}/cancel`.
      required: [run_id, status]
      properties:
        run_id:
          type: integer
          format: int64
        status:
          type: string
          const: cancel_requested

    RunCancelConflict:
      type: object
      description: >-
        409 body of `POST /v1/runs/{id}/cancel` — the run is terminal or has no live engine
        handle. `run_status` (the row's actual status) is present only on the
        already-terminal arm.
      required: [run_id, status]
      properties:
        run_id:
          type: integer
          format: int64
        status:
          type: string
          const: not_running
        run_status:
          type: string
          description: The run row's actual status (present when the row is already terminal).

    RunStatus:
      type: string
      description: >-
        Terminal/in-flight run status (serde snake_case of `engine::RunStatus`). Treat as an
        open string enum in clients.
      enum: [running, success, failed, cancelled, timeout, captcha_required, twofa_required]

    StepStatus:
      type: string
      description: Coarse per-step lifecycle marker.
      enum: [running, succeeded, failed, skipped]

    RunEvent:
      description: >-
        One SSE frame's JSON payload, tagged by its `event` field (which also matches the
        SSE `event:` name). `finished` and `error` are stream-closing.
      oneOf:
        - $ref: '#/components/schemas/RunEventStarted'
        - $ref: '#/components/schemas/RunEventStep'
        - $ref: '#/components/schemas/RunEventProgress'
        - $ref: '#/components/schemas/RunEventFinished'
        - $ref: '#/components/schemas/RunEventError'
      discriminator:
        propertyName: event
        mapping:
          started: '#/components/schemas/RunEventStarted'
          step: '#/components/schemas/RunEventStep'
          progress: '#/components/schemas/RunEventProgress'
          finished: '#/components/schemas/RunEventFinished'
          error: '#/components/schemas/RunEventError'

    RunEventStarted:
      type: object
      description: >-
        The run is registered and about to drive its steps. `total_steps` counts the raw
        steps the engine will iterate (a synthetic subscription seed may report 0).
      required: [event, run_id, total_steps]
      properties:
        event:
          type: string
          const: started
        run_id:
          type: integer
          format: int64
        total_steps:
          type: integer

    RunEventStep:
      type: object
      description: >-
        A step transitioned. `index` is 0-based into the raw step list; `step_type` is the
        recorded step kind — never a value.
      required: [event, run_id, index, step_type, status]
      properties:
        event:
          type: string
          const: step
        run_id:
          type: integer
          format: int64
        index:
          type: integer
        step_type:
          type: string
        status:
          $ref: '#/components/schemas/StepStatus'

    RunEventProgress:
      type: object
      description: Coarse progress hint — `completed` of `total` steps done.
      required: [event, run_id, completed, total]
      properties:
        event:
          type: string
          const: progress
        run_id:
          type: integer
          format: int64
        completed:
          type: integer
        total:
          type: integer

    RunEventFinished:
      type: object
      description: 'TERMINAL: the run reached a final status. Stream-closing.'
      required: [event, run_id, status]
      properties:
        event:
          type: string
          const: finished
        run_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/RunStatus'

    RunEventError:
      type: object
      description: >-
        TERMINAL: the run failed around the step loop. `message` is an operator-facing
        classification, never a raw secret/value. Stream-closing.
      required: [event, run_id, message]
      properties:
        event:
          type: string
          const: error
        run_id:
          type: integer
          format: int64
        message:
          type: string

    # ------------------------------------------------------------- monitors ---
    Monitor:
      type: object
      description: >-
        A monitor (`targets` row). `setup_steps` is credential-REDACTED on every response:
        its `credentials` sub-object is replaced with the sentinel string `«redacted»` (an
        unparsable stored payload collapses to the bare sentinel string). List/get responses
        are additionally enriched with live state (`state`, `last_checked_at`,
        `status_code`, `is_up`, `last_change_at`, `state_updated_at`) and counts
        (`changes_count`, `selector_count`); create/update responses are the bare row.
      required: [id, url, check_type, enabled, requires_playwright, on_change_enabled,
                 on_change_in_session, created_at]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
        check_type:
          type: string
          description: '`content` | `uptime`.'
        selector:
          type: [string, 'null']
        ignore_regex:
          type: [string, 'null']
        check_period_ms:
          type: [integer, 'null']
          format: int64
        expected_status_code:
          type: [integer, 'null']
          format: int64
        timeout_ms:
          type: [integer, 'null']
          format: int64
        max_response_time_ms:
          type: [integer, 'null']
          format: int64
        check_ssl:
          type: [integer, 'null']
          description: 0/1 integer flag.
        enabled:
          type: integer
          description: 0/1 integer flag.
        requires_playwright:
          type: integer
          description: 0/1 integer flag (JS/Playwright path vs plain HTML fetch).
        baseline_hash:
          type: [string, 'null']
        baseline_content:
          type: [string, 'null']
        baseline_fetched_at:
          type: [string, 'null']
        pre_check_workflow_id:
          type: [integer, 'null']
          format: int64
        setup_steps:
          description: >-
            Redacted setup-steps manifest: an object whose `credentials` is the string
            `«redacted»`, the bare sentinel string, or null.
          type: [object, string, 'null']
        on_change_workflow_id:
          type: [integer, 'null']
          format: int64
        on_change_enabled:
          type: integer
          description: 0/1 integer flag.
        on_change_conditions:
          type: [string, 'null']
          description: JSON-TEXT (returned as the stored string).
        on_change_in_session:
          type: integer
          description: 0/1 integer flag.
        persona_id:
          type: [integer, 'null']
          format: int64
        auth_session_encrypted:
          type: [string, 'null']
          description: Sealed session blob (opaque; present as stored).
        notification_providers:
          type: [string, 'null']
        provider_notification_settings:
          type: [string, 'null']
        notification_title:
          type: [string, 'null']
        notification_message:
          type: [string, 'null']
        notification_priority:
          type: [integer, 'null']
          format: int64
        next_run_at:
          type: [string, 'null']
        schedule_kind:
          type: [string, 'null']
          description: '`interval` (default) | `daily` | `weekly`.'
        schedule_time:
          type: [string, 'null']
        schedule_days:
          type: [string, 'null']
          description: JSON array string of ISO weekday ints.
        schedule_tz:
          type: [string, 'null']
        created_at:
          type: string
        updated_at:
          type: [string, 'null']
        state:
          type: [string, 'null']
          description: 'Enrichment (list/get only): live check state (`unchanged`, `changed`, `error`, `checking`, …).'
        last_checked_at:
          type: [string, 'null']
          description: Enrichment (list/get only).
        status_code:
          type: [integer, 'null']
          description: Enrichment (list/get only).
        is_up:
          type: [boolean, 'null']
          description: Enrichment (list/get only).
        last_change_at:
          type: [string, 'null']
          description: Enrichment (list/get only).
        state_updated_at:
          type: [string, 'null']
          description: Enrichment (list/get only) — the live-state row's own update stamp.
        changes_count:
          type: integer
          description: Enrichment (list/get only).
        selector_count:
          type: integer
          description: Enrichment (list/get only).

    MonitorCreate:
      type: object
      description: >-
        Create body (`store::targets::NewTarget`). Flag fields accept booleans or 0/1
        integers; numeric fields also accept numeric strings; `setup_steps` /
        `on_change_conditions` / `notification_providers` / `provider_notification_settings`
        / `schedule_days` accept a JSON value or a pre-serialized JSON string.
      required: [url]
      properties:
        url:
          type: string
        check_type:
          type: [string, 'null']
          description: '`content` (default) | `uptime`.'
        selector:
          type: [string, 'null']
        ignore_regex:
          type: [string, 'null']
        check_period_ms:
          type: [integer, string, 'null']
          description: Floored to the anti-detection minimum for the chosen path.
        expected_status_code:
          type: [integer, string, 'null']
        timeout_ms:
          type: [integer, string, 'null']
        max_response_time_ms:
          type: [integer, string, 'null']
        check_ssl:
          type: [boolean, integer, 'null']
        enabled:
          type: [boolean, integer, 'null']
        requires_playwright:
          type: [boolean, integer, 'null']
        pre_check_workflow_id:
          type: [integer, string, 'null']
        setup_steps:
          description: '`{steps, credentials}` manifest — JSON object or JSON string.'
        on_change_workflow_id:
          type: [integer, string, 'null']
        on_change_enabled:
          type: [boolean, integer, 'null']
        on_change_conditions:
          description: JSON object or JSON string.
        on_change_in_session:
          type: [boolean, integer, 'null']
        persona_id:
          type: [integer, string, 'null']
        notification_providers:
          description: JSON value or JSON string.
        provider_notification_settings:
          description: JSON value or JSON string.
        notification_title:
          type: [string, 'null']
        notification_message:
          type: [string, 'null']
        notification_priority:
          type: [integer, string, 'null']
        next_run_at:
          type: [string, 'null']
        schedule_kind:
          type: [string, 'null']
        schedule_time:
          type: [string, 'null']
        schedule_days:
          description: ISO weekday ints — JSON array (or JSON string).
        schedule_tz:
          type: [string, 'null']

    MonitorUpdate:
      type: object
      description: >-
        Partial PATCH body (`store::targets::TargetUpdate`) — same flexible field shapes as
        create, everything optional (COALESCE semantics).
      properties:
        url:
          type: [string, 'null']
        check_type:
          type: [string, 'null']
        selector:
          type: [string, 'null']
        ignore_regex:
          type: [string, 'null']
        check_period_ms:
          type: [integer, string, 'null']
        expected_status_code:
          type: [integer, string, 'null']
        timeout_ms:
          type: [integer, string, 'null']
        max_response_time_ms:
          type: [integer, string, 'null']
        check_ssl:
          type: [boolean, integer, 'null']
        enabled:
          type: [boolean, integer, 'null']
        requires_playwright:
          type: [boolean, integer, 'null']
        setup_steps:
          description: JSON object or JSON string; `"null"`/`""` clears.
        on_change_workflow_id:
          type: [integer, string, 'null']
        on_change_enabled:
          type: [boolean, integer, 'null']
        on_change_conditions:
          description: JSON object or JSON string.
        on_change_in_session:
          type: [boolean, integer, 'null']
        persona_id:
          type: [integer, string, 'null']
        notification_providers:
          description: JSON value or JSON string.
        provider_notification_settings:
          description: JSON value or JSON string.
        notification_title:
          type: [string, 'null']
        notification_message:
          type: [string, 'null']
        notification_priority:
          type: [integer, string, 'null']
        next_run_at:
          type: [string, 'null']
        schedule_kind:
          type: [string, 'null']
        schedule_time:
          type: [string, 'null']
        schedule_days:
          description: ISO weekday ints — JSON array (or JSON string).
        schedule_tz:
          type: [string, 'null']

    CapacitySnapshot:
      type: object
      description: Device check-capacity meter (`scheduler::capacity::CapacitySnapshot`).
      required: [budget_units_per_min, used_units_per_min, cores, ram_gib, override_units_per_min]
      properties:
        budget_units_per_min:
          type: number
        used_units_per_min:
          type: number
        cores:
          type: integer
        ram_gib:
          type: number
        override_units_per_min:
          type: integer
          description: Non-zero when a config override replaces the auto budget.

    CheckOutcome:
      type: object
      description: >-
        Outcome of checking a single target (`monitor::CheckOutcome`). Optional fields are
        OMITTED (not null) when absent. Serialization failure degrades to
        `{"monitor_id": <id>}`.
      required: [target_id, status]
      properties:
        target_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [unchanged, changed, error, timeout, skipped]
        change_id:
          type: integer
          format: int64
          description: The written `changes.id` (content targets, only when a change was recorded).
        dispatch:
          $ref: '#/components/schemas/DispatchOutcome'
        error:
          type: string
          description: Human-readable error (only when status is `error`/`timeout`).

    DispatchOutcome:
      type: object
      description: Automation dispatch tally for one detected change.
      required: [matched, succeeded, failed]
      properties:
        matched:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer

    MonitorHistory:
      type: object
      description: Paginated change + uptime history (`GET /v1/monitors/{id}/changes`).
      required: [monitor_id, limit, offset, has_more, changes, uptime_checks]
      properties:
        monitor_id:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
          description: Whether EITHER series has rows beyond this page.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        uptime_checks:
          type: array
          items:
            $ref: '#/components/schemas/UptimeCheck'

    Change:
      type: object
      description: One content-diff history row (`store::changes::Change`).
      required: [id, target_id, content_hash, first_detected_at, last_detected_at]
      properties:
        id:
          type: integer
          format: int64
        target_id:
          type: integer
          format: int64
        target_selector_id:
          type: [integer, 'null']
          format: int64
        content_hash:
          type: string
        previous_hash:
          type: [string, 'null']
        diff_snippet:
          type: [string, 'null']
        content_before:
          type: [string, 'null']
        content_after:
          type: [string, 'null']
        screenshot_before:
          type: [string, 'null']
        screenshot_after:
          type: [string, 'null']
        screenshot_diff:
          type: [string, 'null']
        first_detected_at:
          type: string
        last_detected_at:
          type: string

    UptimeCheck:
      type: object
      description: One up/down + SSL sample (`store::uptime_checks::UptimeCheck`).
      required: [id, target_id, checked_at, is_up]
      properties:
        id:
          type: integer
          format: int64
        target_id:
          type: integer
          format: int64
        checked_at:
          type: string
        is_up:
          type: integer
          description: 0/1 integer flag.
        status_code:
          type: [integer, 'null']
        response_time_ms:
          type: [integer, 'null']
          format: int64
        error_message:
          type: [string, 'null']
        ssl_cert_valid:
          type: [integer, 'null']
          description: 0/1 integer flag.
        ssl_cert_expires_at:
          type: [string, 'null']
        ssl_cert_days_until_expiry:
          type: [integer, 'null']
          format: int64
        ssl_cert_issuer:
          type: [string, 'null']
        ssl_error:
          type: [string, 'null']

    RecentChange:
      type: object
      description: One enriched cross-monitor change (`store::changes::RecentChange`).
      required: [id, target_id, target_url, first_detected_at, last_detected_at]
      properties:
        id:
          type: integer
          format: int64
        target_id:
          type: integer
          format: int64
        target_url:
          type: string
        target_selector_id:
          type: [integer, 'null']
          format: int64
        selector_name:
          type: [string, 'null']
        diff_snippet:
          type: [string, 'null']
        first_detected_at:
          type: string
        last_detected_at:
          type: string

    # ------------------------------------------------------------ selectors ---
    Selector:
      type: object
      description: One monitor content selector (`store::target_selectors::TargetSelector`).
      required: [id, target_id, name, selector, enabled, created_at]
      properties:
        id:
          type: integer
          format: int64
        target_id:
          type: integer
          format: int64
        name:
          type: string
        selector:
          type: string
        description:
          type: [string, 'null']
        enabled:
          type: integer
          description: 0/1 integer flag.
        content_type:
          type: [string, 'null']
          description: '`text` | `html` | `visual`.'
        visual_region:
          type: [string, 'null']
          description: JSON-TEXT region descriptor (visual selectors).
        ignore_regex:
          type: [string, 'null']
        priority:
          type: [integer, 'null']
          format: int64
        baseline_hash:
          type: [string, 'null']
        baseline_content:
          type: [string, 'null']
        baseline_screenshot:
          type: [string, 'null']
        baseline_fetched_at:
          type: [string, 'null']
        last_content_hash:
          type: [string, 'null']
        last_checked_at:
          type: [string, 'null']
        change_count:
          type: [integer, 'null']
          format: int64
        created_at:
          type: string
        updated_at:
          type: [string, 'null']

    SelectorCreate:
      type: object
      description: >-
        Create body. The monitor id comes from the path. `enabled` accepts a boolean or 0/1
        integer; `visual_region` accepts an object or a JSON string; `priority` also accepts
        a numeric string.
      required: [selector]
      properties:
        name:
          type: string
          description: Defaults to the selector string when empty.
        selector:
          type: string
        description:
          type: [string, 'null']
        enabled:
          type: [boolean, integer, 'null']
        content_type:
          type: [string, 'null']
        visual_region:
          description: Region object (or JSON string).
        ignore_regex:
          type: [string, 'null']
        priority:
          type: [integer, string, 'null']

    SelectorUpdate:
      type: object
      description: Partial update — same flexible shapes as create, all optional.
      properties:
        name:
          type: [string, 'null']
        selector:
          type: [string, 'null']
        description:
          type: [string, 'null']
        enabled:
          type: [boolean, integer, 'null']
        content_type:
          type: [string, 'null']
        visual_region:
          description: Region object (or JSON string).
        ignore_regex:
          type: [string, 'null']
        priority:
          type: [integer, string, 'null']

    SelectorProbe:
      type: object
      description: >-
        Live probe result (`monitor::SelectorProbe`). Optional fields are OMITTED when
        absent.
      required: [selector_id, matched]
      properties:
        selector_id:
          type: integer
          format: int64
        matched:
          type: boolean
        content:
          type: string
          description: Extracted text/html (truncated). Omitted for visual selectors or on a miss.
        content_hash:
          type: string
          description: SHA-256 content hash (text/html) or pixel hash (visual). Omitted on a miss.
        screenshot:
          type: string
          description: Base64 PNG of the captured region (visual selectors only).
        status_code:
          type: integer
          format: int64
        error:
          type: string
          description: Present when the selector did not resolve.

    # ----------------------------------------------------------- extractors ---
    Extractor:
      type: object
      description: One field extractor (`store::selector_extractors::SelectorExtractor`).
      required: [id, target_selector_id, name, output_name, enabled, extract_type, is_array]
      properties:
        id:
          type: integer
          format: int64
        target_selector_id:
          type: integer
          format: int64
        name:
          type: string
        output_name:
          type: string
        enabled:
          type: integer
          description: 0/1 integer flag.
        extract_type:
          type: string
          description: One of the extraction engine types (e.g. `text`, `regex`, `css`, `number`, `json`).
        config:
          type: [string, 'null']
          description: JSON-TEXT extractor config.
        is_array:
          type: integer
          description: 0/1 integer flag.
        default_value:
          type: [string, 'null']

    ExtractorCreate:
      type: object
      description: >-
        Create body. `enabled`/`is_array` accept booleans or 0/1 integers; `config` accepts
        an object or a JSON string.
      required: [target_selector_id, output_name]
      properties:
        target_selector_id:
          type: integer
          format: int64
        name:
          type: string
          description: Defaults to `output_name` when empty.
        output_name:
          type: string
        enabled:
          type: [boolean, integer, 'null']
        extract_type:
          type: [string, 'null']
        config:
          description: Extractor config object (or JSON string).
        is_array:
          type: [boolean, integer, 'null']
        default_value:
          type: [string, 'null']

    ExtractorUpdate:
      type: object
      description: Partial update — same flexible shapes as create, all optional.
      properties:
        name:
          type: [string, 'null']
        output_name:
          type: [string, 'null']
        enabled:
          type: [boolean, integer, 'null']
        extract_type:
          type: [string, 'null']
        config:
          description: Extractor config object (or JSON string).
        is_array:
          type: [boolean, integer, 'null']
        default_value:
          type: [string, 'null']

    ExtractorTestRequest:
      type: object
      description: Body for `POST /v1/extractors/{extractor_id}/test`.
      properties:
        content:
          type: string
          description: The content to run the saved extractor against (defaults to empty).
        content_type:
          type: [string, 'null']
          description: Accepted for API parity; the engine keys off `extract_type`.

    ExtractorTestResult:
      type: object
      required: [extractor_id, output_name, value]
      properties:
        extractor_id:
          type: integer
          format: int64
        output_name:
          type: string
        value:
          description: The extracted value (any JSON value; null on no match without default).

    # ---------------------------------------------------------- automations ---
    Automation:
      type: object
      description: >-
        One automation. On output the JSON-TEXT columns are PARSED: `conditions` is an
        object, `actions` an array, `blocks` an array or null.
      required: [id, event_type, name, enabled, conditions, actions, created_at]
      properties:
        id:
          type: integer
          format: int64
        target_id:
          type: [integer, 'null']
          format: int64
        event_type:
          type: string
          description: '`change_detected` | `webhook_received` | `workflow_started` | `workflow_completed`.'
        target_selector_id:
          type: [integer, 'null']
          format: int64
        workflow_id:
          type: [integer, 'null']
          format: int64
        webhook_trigger_id:
          type: [integer, 'null']
          format: int64
        name:
          type: string
        description:
          type: [string, 'null']
        enabled:
          type: integer
          description: 0/1 integer flag.
        priority:
          type: [integer, 'null']
          format: int64
        conditions:
          type: object
          description: Parsed conditions object (parse failures degrade to `{}`).
          additionalProperties: true
        actions:
          type: array
          description: Parsed actions array (parse failures degrade to `[]`).
        blocks:
          type: [array, 'null']
          description: Parsed block tree, or null.
        last_triggered_at:
          type: [string, 'null']
        trigger_count:
          type: [integer, 'null']
          format: int64
        created_at:
          type: string
        updated_at:
          type: [string, 'null']

    AutomationCreate:
      type: object
      description: >-
        Create body (`store::automations::NewAutomation`). `conditions` / `actions` /
        `blocks` accept a parsed JSON value or a JSON string.
      required: [name]
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
        event_type:
          type: [string, 'null']
        target_id:
          type: [integer, 'null']
          format: int64
        target_selector_id:
          type: [integer, 'null']
          format: int64
        workflow_id:
          type: [integer, 'null']
          format: int64
        webhook_trigger_id:
          type: [integer, 'null']
          format: int64
        enabled:
          type: [integer, 'null']
          description: 0/1 integer flag.
        priority:
          type: [integer, 'null']
          format: int64
        conditions:
          description: Conditions object (or JSON string). Defaults to `{}`.
        actions:
          description: Actions array (or JSON string). Defaults to `[]`.
        blocks:
          description: Block tree (or JSON string).

    AutomationUpdate:
      type: object
      description: Partial PATCH body (`store::automations::AutomationPatch`), COALESCE semantics.
      properties:
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
        event_type:
          type: [string, 'null']
        target_id:
          type: [integer, 'null']
          format: int64
        target_selector_id:
          type: [integer, 'null']
          format: int64
        workflow_id:
          type: [integer, 'null']
          format: int64
        webhook_trigger_id:
          type: [integer, 'null']
          format: int64
        enabled:
          type: [integer, 'null']
          description: 0/1 integer flag.
        priority:
          type: [integer, 'null']
          format: int64
        conditions:
          description: Conditions object (or JSON string).
        actions:
          description: Actions array (or JSON string).
        blocks:
          description: Block tree (or JSON string).

    AutomationEnableRequest:
      type: object
      description: Optional body — absent/empty defaults to enabling.
      properties:
        enabled:
          type: boolean
          default: true

    AutomationRunRequest:
      type: object
      description: Optional body — inputs handed to the flow's workflow actions.
      properties:
        inputs:
          type: [object, 'null']

    AutomationRunResult:
      description: >-
        Manual-run outcome — either an execution record or a skip notice (a status-gated
        event with no triggering context).
      oneOf:
        - type: object
          title: Executed
          required: [execution_id, status, results, error]
          properties:
            execution_id:
              type: integer
              format: int64
            status:
              type: string
            results:
              description: Parsed action results (any JSON value; null on parse failure).
            error:
              type: [string, 'null']
        - type: object
          title: Skipped
          required: [status, reason]
          properties:
            status:
              type: string
              const: skipped
            reason:
              type: string

    # -------------------------------------------------------------- personas ---
    Persona:
      type: object
      description: >-
        The shaped persona wire form (cloud `PersonaResponse` parity). Secrets collapse to
        `has_*` booleans plus `linked_secrets` names; cloud-only columns (mailbox, relay
        minting, preferred agent) are always null locally. A vault-linked username
        (`{{vault:…}}` template) is surfaced as null here — the link appears in
        `linked_secrets` instead.
      required: [id, name, description, target_domain, login_username, has_password,
                 twofa_method, has_totp_seed, email_otp_mode, mail_connection_id,
                 connected_mailbox, relay_address, relay_token, relay_inbound_address,
                 relay_inbound_url, has_fingerprint, preferred_agent_id, has_proxy,
                 proxy_lawful_use_ack_at, is_active, validation_status, has_warm_session,
                 session_expires_at, last_login_at, last_used_at, created_at, updated_at,
                 linked_workflows, linked_secrets]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: [string, 'null']
        target_domain:
          type: [string, 'null']
        login_username:
          type: [string, 'null']
        has_password:
          type: boolean
        twofa_method:
          type: string
          enum: [none, totp, email_otp, sms]
        has_totp_seed:
          type: boolean
        email_otp_mode:
          type: [string, 'null']
          description: '`oauth_mailbox` | `relay` | null.'
        mail_connection_id:
          type: 'null'
          description: Cloud-only; always null locally.
        connected_mailbox:
          type: 'null'
          description: Cloud-only; always null locally.
        relay_address:
          type: [string, 'null']
        relay_token:
          type: 'null'
          description: Cloud-only; always null locally.
        relay_inbound_address:
          type: 'null'
          description: Cloud-only; always null locally.
        relay_inbound_url:
          type: 'null'
          description: Cloud-only; always null locally.
        has_fingerprint:
          type: boolean
        preferred_agent_id:
          type: 'null'
          description: Cloud-only; always null locally.
        has_proxy:
          type: boolean
        proxy_lawful_use_ack_at:
          type: 'null'
          description: Cloud-only; always null locally.
        is_active:
          type: boolean
        validation_status:
          type: string
        has_warm_session:
          type: boolean
        session_expires_at:
          type: [string, 'null']
        last_login_at:
          type: [string, 'null']
        last_used_at:
          type: [string, 'null']
        created_at:
          type: string
        updated_at:
          type: [string, 'null']
        linked_workflows:
          type: array
          description: Workflows pinned to this persona via `default_persona_id`.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
        linked_secrets:
          type: object
          description: >-
            `{credential_field: vault secret base name}` for values stored as
            `{{vault:…}}` templates. Names only — never values.
          additionalProperties:
            type: string

    PersonaList:
      type: object
      description: '`{data, count}` list envelope.'
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Persona'
        count:
          type: integer

    PersonaWrite:
      type: object
      description: >-
        Shared create/update payload. Plaintext secrets (`password`,
        `extra_login_fields`, `totp_seed`, `proxy_*`) are sealed by the handler and never
        echoed. Several fields distinguish "absent = untouched" from "explicit null =
        clear" (`description`, `target_domain`, `login_username`, `fingerprint`). Secrets
        follow cloud replace semantics: sending `password`/`extra_login_fields` replaces the
        whole credential set (empty ⇒ cleared); an empty-string `totp_seed`/`proxy_server`
        clears that blob. Unknown (cloud-only) fields are ignored.
      properties:
        name:
          type: [string, 'null']
          description: Required (non-empty) on create; renames on update (must stay unique).
        description:
          type: [string, 'null']
          description: Explicit null clears.
        target_domain:
          type: [string, 'null']
          description: Explicit null clears.
        login_username:
          type: [string, 'null']
          description: Literal username or `{{vault:key.username}}` ref; explicit null clears.
        password:
          type: [string, 'null']
          description: Plaintext password or `{{vault:key.password}}` ref; empty clears the credential set.
        extra_login_fields:
          type: [object, 'null']
          description: 'Additional plaintext login fields `{name: value}`.'
          additionalProperties:
            type: string
        twofa_method:
          type: [string, 'null']
          enum: [none, totp, email_otp, sms, null]
        totp_seed:
          type: [string, 'null']
          description: Plaintext base32 seed; empty string on update clears the stored seed.
        totp_digits:
          type: [integer, 'null']
          format: int64
        totp_period_seconds:
          type: [integer, 'null']
          format: int64
        totp_algorithm:
          type: [string, 'null']
        email_otp_mode:
          type: [string, 'null']
          enum: [oauth_mailbox, relay, null]
        relay_address:
          type: [string, 'null']
        otp_extract_config:
          type: [object, 'null']
          description: Email-OTP extraction hints (object); null clears.
        fingerprint:
          type: [object, 'null']
          description: '`{user_agent, locale, timezone}` object to pin; explicit null unpins.'
        proxy_server:
          type: [string, 'null']
          description: BYO proxy server; non-empty requires `proxy_lawful_use_ack`; empty clears.
        proxy_username:
          type: [string, 'null']
        proxy_password:
          type: [string, 'null']
        proxy_lawful_use_ack:
          type: [boolean, 'null']
        is_active:
          type: [boolean, 'null']

    PersonaRun:
      type: object
      description: One recent run that acted as this persona (cloud `PersonaRun` wire shape).
      required: [task_id, workflow_id, workflow_name, status, success, started_at, completed_at, error]
      properties:
        task_id:
          type: integer
          format: int64
          description: The run row id.
        workflow_id:
          type: [integer, 'null']
          format: int64
        workflow_name:
          type: [string, 'null']
        status:
          type: string
        success:
          type: [boolean, 'null']
        started_at:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']
        error:
          type: [string, 'null']
          description: Truncated to 200 characters.

    PersonaRunList:
      type: object
      description: '`{data, count}` list envelope.'
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PersonaRun'
        count:
          type: integer

    ValidateTotpRequest:
      type: object
      required: [totp_seed]
      properties:
        totp_seed:
          type: string
          description: The pasted base32 seed (never stored or logged).
        code:
          type: [string, 'null']
          description: Optional code the user just saw, to cross-check the seed.
        algorithm:
          type: [string, 'null']
          description: Default SHA1.
        digits:
          type: [integer, 'null']
          description: Default 6 (clamped 6..=10).
        period:
          type: [integer, 'null']
          description: Default 30 seconds.

    ValidateTotpResult:
      type: object
      required: [valid_base32, matches_code]
      properties:
        valid_base32:
          type: boolean
        matches_code:
          type: [boolean, 'null']
          description: Null when no code was supplied or the seed is invalid.

    Test2faResult:
      type: object
      description: >-
        2FA smoke-test verdict. `method: "none"` carries a `message`; `method: "totp"`
        carries `kind: "totp"`. The minted code is NEVER returned. Email/SMS methods answer
        400 (cloud-gated) instead of this shape.
      required: [ok, method]
      properties:
        ok:
          type: boolean
          const: true
        method:
          type: string
          enum: [none, totp]
        message:
          type: string
          description: 'Present for `method: "none"`.'
        kind:
          type: string
          const: totp
          description: 'Present for `method: "totp"`.'

    # --------------------------------------------------------------- secrets ---
    Secret:
      type: object
      description: >-
        Secret METADATA (the value/ciphertext is never returned). `name` mirrors `key`
        (cloud parity). Credential secrets surface their non-secret `username`; card
        secrets surface only `card_last4`.
      required: [id, key, name, description, category, is_credential, is_card, username,
                 card_last4, created_at, updated_at, last_used_at, use_count]
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        name:
          type: string
          description: Alias of `key`.
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
          description: e.g. `credentials`, `card`, `api_keys`.
        is_credential:
          type: boolean
          description: True only for a real `{username, password}` pair.
        is_card:
          type: boolean
        username:
          type: [string, 'null']
          description: The credential pair's username (never the password).
        card_last4:
          type: [string, 'null']
          description: Last 4 digits of a card secret's number (never the full PAN/CVC).
        created_at:
          type: string
        updated_at:
          type: [string, 'null']
        last_used_at:
          type: [string, 'null']
        use_count:
          type: [integer, 'null']
          format: int64

    SecretList:
      type: object
      description: '`{data, count}` list envelope.'
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        count:
          type: integer

    SecretCreate:
      type: object
      description: >-
        Create body — exactly one of three shapes: a single `value`, a credential pair
        (`username` + `password`), or a `card` object (needs at least `number` and
        `expiry`). `key` is a legacy alias for `name`. Name pattern:
        `^[a-zA-Z_][a-zA-Z0-9_.-]*$`, max 255 chars. Plaintext is sealed handler-side.
      properties:
        name:
          type: [string, 'null']
          description: The unique secret name (required unless `key` is given).
        key:
          type: [string, 'null']
          description: Legacy alias for `name`.
        value:
          type: [string, 'null']
          description: Single-value secret plaintext.
        username:
          type: [string, 'null']
          description: Credential-pair username (with `password`).
        password:
          type: [string, 'null']
          description: Credential-pair password (with `username`).
        card:
          type: [object, 'null']
          description: 'Card fields: `{name, number, expiry, cvc, zip}` (strings).'
          properties:
            name: {type: string}
            number: {type: string}
            expiry: {type: string}
            cvc: {type: string}
            zip: {type: string}
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']

    # ----------------------------------------------------------------- vault ---
    VaultStatus:
      type: object
      description: Non-secret app-lock snapshot.
      required: [enabled, locked, idle_timeout_secs]
      properties:
        enabled:
          type: boolean
        locked:
          type: boolean
        idle_timeout_secs:
          type: integer

    VaultOk:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    VaultUnlockRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase:
          type: string
          description: Consumed handler-side; never logged, echoed, or persisted.

    # ----------------------------------------------------------------- files ---
    StoredFile:
      type: object
      description: >-
        OpenAI-style file handle (`api/v1/files.rs::WireStoredFile`). Note `bytes` (not
        `size_bytes`) and `created_at` as UNIX epoch SECONDS (not RFC3339).
      required: [id, object, filename, content_type, bytes, created_at, status, source, purpose]
      properties:
        id:
          type: string
          description: '`file_<hex>` handle id.'
        object:
          type: string
          const: file
        filename:
          type: string
        content_type:
          type: string
        bytes:
          type: integer
          format: int64
          description: Size in bytes.
        created_at:
          type: integer
          format: int64
          description: UNIX epoch seconds (0 when the stored timestamp is malformed).
        status:
          type: string
        source:
          type: string
          enum: [upload, api, workflow_output]
        purpose:
          type: string
          description: Defaults to `user_data`.

    FileList:
      type: object
      description: '`{data, count}` list envelope.'
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StoredFile'
        count:
          type: integer

    FileFromDataRequest:
      type: object
      description: Body for `POST /v1/files/from-data`.
      required: [workflow_id]
      properties:
        workflow_id:
          type: integer
          format: int64
        format:
          type: [string, 'null']
          enum: [csv, json, null]
          description: Defaults to `csv`.
        filters:
          description: >-
            Optional structured-filter array (same clause schema as the data table's
            `filters` param).
          type: [array, 'null']

    # ------------------------------------------------------------------ data ---
    DataWorkflowsList:
      type: object
      description: The Data-explorer workflow picker payload.
      required: [workflows]
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/DataWorkflowSummary'

    DataWorkflowSummary:
      type: object
      required: [workflow_id, workflow_name, run_count, last_data_at, last_delta]
      properties:
        workflow_id:
          type: integer
          format: int64
        workflow_name:
          type: string
        run_count:
          type: integer
          description: Distinct successful runs that contributed at least one row.
        last_data_at:
          type: [string, 'null']
          description: Newest contributing run's timestamp.
        last_delta:
          description: >-
            Newest two snapshots compared under the sampled identity; null when the dataset
            has fewer than 2 snapshots or is too large.
          oneOf:
            - type: object
              required: [new, changed, removed]
              properties:
                new: {type: integer}
                changed: {type: integer}
                removed: {type: integer}
            - type: 'null'

    DataTableRow:
      type: object
      description: >-
        One table row: run-meta at the top level, data columns nested under `fields`. Lens
        views (`view=latest|run`) add a `lineage` sibling (`uid`, `change`,
        `changed_fields` — present only when change is `changed` —, `changed_leaf_count`,
        `first_seen_at`, `last_seen_at`, `versions`, `source`, and `prev_run_id` on run
        views).
      required: [run_id, run_at, status, record_index, fields]
      properties:
        run_id:
          type: integer
          format: int64
        run_at:
          type: [string, 'null']
        status:
          type: [string, 'null']
        record_index:
          type: integer
        fields:
          type: object
          description: The extracted data columns (redacted; a column absent for a row is null).
          additionalProperties: true
        lineage:
          type: object
          description: Lens views only.
          additionalProperties: true

    WorkflowDataTable:
      type: object
      description: >-
        The aggregated extracted-data table. The base fields are always present; lens views
        add `identity` (+ `counts`/`sources` on latest, + `delta`/`removed_records`/
        `prev_run_id`/`sources` on run views).
      required: [workflow_id, workflow_name, columns, declared, rows, total, scanned_runs,
                 truncated, limit, offset]
      properties:
        workflow_id:
          type: integer
          format: int64
        workflow_name:
          type: string
        columns:
          type: array
          items:
            type: string
        declared:
          type: boolean
          description: Whether the columns come from the workflow's declared output fields.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DataTableRow'
        total:
          type: integer
          description: Post-filter row total before pagination.
        scanned_runs:
          type: integer
          description: Successful data-bearing runs scanned (capped at 1000).
        truncated:
          type: boolean
          description: True when the scan hit the 1000-run cap.
        limit:
          type: [integer, 'null']
        offset:
          type: integer
        identity:
          type: object
          description: Lens views only — the chosen record identity.
          additionalProperties: true
        counts:
          type: object
          description: view=latest only — post-dedup change counts.
          properties:
            new: {type: integer}
            changed: {type: integer}
            same: {type: integer}
            missing: {type: integer}
        sources:
          type: object
          description: >-
            Lens views only — `{<list key | "">: count}` buckets of the rowset by
            originating list key (pre-source-filter).
          additionalProperties:
            type: integer
        delta:
          type: object
          description: view=run only — the snapshot delta vs the previous chain member.
          additionalProperties: true
        removed_records:
          type: array
          description: view=run only — records that vanished vs the previous snapshot.
          items:
            type: object
            required: [uid, fields]
            properties:
              uid: {type: string}
              fields:
                type: object
                additionalProperties: true
        prev_run_id:
          type: [integer, 'null']
          format: int64
          description: view=run only — the previous chain member (null for the oldest).

    DataRunsIndex:
      type: object
      description: The snapshot index (`GET /v1/workflows/{id}/data/runs`).
      required: [runs, identity, scanned_runs, truncated]
      properties:
        runs:
          type: array
          description: >-
            Newest-first successful data-bearing runs; each entry carries `run_id`, record
            count, explicit-empty flag, per-snapshot delta (null for the oldest) and the
            run's `status`.
          items:
            type: object
            additionalProperties: true
        identity:
          type: object
          description: The chosen record identity.
          additionalProperties: true
        scanned_runs:
          type: integer
        truncated:
          type: boolean

    DataFacets:
      type: object
      description: Per-column facets (`GET /v1/workflows/{id}/data/facets`).
      required: [workflow_id, columns, facets, row_count, scanned_runs, truncated]
      properties:
        workflow_id:
          type: integer
          format: int64
        columns:
          type: array
          items:
            type: string
        facets:
          type: object
          description: >-
            Per-column facet descriptors (inferred type, non-empty count, numeric min/max,
            distinct pick-list when low-cardinality).
          additionalProperties: true
        row_count:
          type: integer
        scanned_runs:
          type: integer
        truncated:
          type: boolean
        sources:
          type: object
          description: Lens views only — pre-filter source buckets.
          additionalProperties:
            type: integer

    DeleteWorkflowDataRequest:
      type: object
      description: >-
        Body for `DELETE /v1/workflows/{id}/data`. The delete set is `records` ∪ every
        stored version of each uid in `record_uids`. An empty body deletes nothing (200
        with zeros).
      properties:
        records:
          type: array
          items:
            type: object
            required: [run_id]
            properties:
              run_id:
                type: integer
                format: int64
              record_index:
                type: integer
                default: 0
        record_uids:
          type: array
          description: Lineage uids — each expands to EVERY stored version.
          items:
            type: string
        key:
          type: [string, 'null']
          description: Identity pinning echo — the identity fields the uids came from.

    DeleteWorkflowDataResult:
      type: object
      required: [deleted, resolved, unmatched]
      properties:
        deleted:
          type: integer
          description: Number of extracted rows removed.
        resolved:
          type: object
          description: '`{uid: n_versions}` for each matched uid.'
          additionalProperties:
            type: integer
        unmatched:
          type: array
          description: Requested uids that matched nothing.
          items:
            type: string

    # -------------------------------------------------------------- datasets ---
    Dataset:
      type: object
      description: One entry in the unified dataset catalogue.
      required: [id, name, source_type, run_count, last_updated]
      properties:
        id:
          type: integer
          format: int64
          description: The id of the workflow/crawl that produced the data.
        name:
          type: [string, 'null']
        source_type:
          type: string
          description: '`crawl` for a whole-site crawl dataset, otherwise `workflow`.'
          enum: [crawl, workflow]
        run_count:
          type: integer
          description: Distinct successful runs that contributed at least one record.
        last_updated:
          type: [string, 'null']
          description: Newest contributing run's timestamp.
        origin:
          type: string
          description: >-
            Where the dataset lives — present on a cloud-linked daemon, which merges
            forwarded cloud crawl datasets into this list.

    DatasetList:
      type: object
      description: '`GET /v1/datasets` — a bespoke `{datasets}` envelope, NOT `{data, count}`.'
      required: [datasets]
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'

    DatasetMeta:
      type: object
      description: >-
        A dataset's metadata + inferred schema. A cloud crawl dataset forwarded by a linked
        daemon returns the cloud facets shape, which additionally carries `collections`.
      required: [id, name, source_type, columns, facets, row_count, run_count, truncated]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        source_type:
          type: string
          enum: [crawl, workflow]
        columns:
          type: array
          items:
            type: string
        facets:
          type: object
          description: >-
            Per-column facet descriptors (inferred type, non-empty count, numeric min/max,
            distinct pick-list when low-cardinality).
          additionalProperties: true
        collections:
          type: array
          description: >-
            Nested array paths (e.g. `posts.items`) you can pivot to with `collection`.
            Only on a FORWARDED cloud dataset — a local dataset omits this key.
          items:
            type: string
        row_count:
          type: integer
        run_count:
          type: integer
          description: Runs actually scanned to build this schema.
        truncated:
          type: boolean
          description: The run-scan cap bounded the answer.

    DatasetRecords:
      type: object
      description: >-
        `GET /v1/datasets/{id}/records` with `format=json` — a page of the dataset's
        records. Reuses the workflow-data row shape.
      required: [dataset, columns, declared, records, total, scanned_runs, truncated, limit,
                 offset]
      properties:
        dataset:
          $ref: '#/components/schemas/DatasetRef'
        columns:
          type: array
          items:
            type: string
        declared:
          type: boolean
          description: The columns come from the workflow's declared output fields.
        records:
          type: array
          items:
            $ref: '#/components/schemas/DataTableRow'
        total:
          type: [integer, 'null']
          description: Matching records before pagination.
        scanned_runs:
          type: [integer, 'null']
        truncated:
          type: boolean
        limit:
          type: [integer, 'null']
        offset:
          type: [integer, 'null']

    DatasetRef:
      type: object
      description: The dataset a record page or search hit belongs to.
      required: [id, name, source_type]
      properties:
        id:
          type: [integer, 'null']
          format: int64
        name:
          type: [string, 'null']
        source_type:
          type: string
          enum: [crawl, workflow]

    DatasetSearchHit:
      type: object
      description: One matched record, tagged with the dataset it came from.
      required: [dataset, run_id, run_at, fields, highlight]
      properties:
        dataset:
          $ref: '#/components/schemas/DatasetRef'
        run_id:
          type: [integer, 'null']
          format: int64
        run_at:
          type: [string, 'null']
        fields:
          type: object
          description: The matched record's extracted columns.
          additionalProperties: true
        highlight:
          description: >-
            A snippet around the first matching term, or null when none could be built
            (a forwarded cloud search never carries one).
          oneOf:
            - type: object
              required: [field, snippet]
              properties:
                field:
                  type: string
                  description: The column the snippet was taken from.
                snippet:
                  type: string
            - type: 'null'

    DatasetSearchResult:
      type: object
      description: >-
        `GET /v1/datasets/search` and `GET /v1/datasets/{id}/search` with `format=json`.
      required: [query, terms, results, total, truncated, scanned_runs]
      properties:
        query:
          type: string
          description: The query as received (trimmed).
        terms:
          type: array
          description: The parsed terms — ANDed, case-insensitive, prefix-matched.
          items:
            type: string
        results:
          type: array
          description: Matched records, newest-first.
          items:
            $ref: '#/components/schemas/DatasetSearchHit'
        total:
          type: integer
          description: Matching records before pagination.
        truncated:
          type: boolean
          description: The candidate-run cap (500) was hit, so older matches may be missing.
        scanned_runs:
          type: [integer, 'null']

    # ------------------------------------------------------------------ keys ---
    ApiKey:
      type: object
      description: >-
        One `wlk_` key record. The sha256 `key_hash` is NEVER serialized; the plaintext key
        exists only in the create response.
      required: [id, name, prefix, scopes, enabled, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          type: string
          description: '`wlk_` + first 6 chars of the raw key (display only).'
        scopes:
          type: string
          description: 'CSV of scopes: `read|run|admin`.'
        enabled:
          type: integer
          description: 0/1 integer flag.
        last_used_at:
          type: [string, 'null']
        created_at:
          type: string
        revoked_at:
          type: [string, 'null']

    ApiKeyList:
      type: object
      description: '`{data, count}` list envelope.'
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        count:
          type: integer

    ApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        scopes:
          type: [string, 'null']
          description: CSV scopes (`read|run|admin`). Defaults to `run` when omitted.

    ApiKeyCreated:
      description: >-
        The created key record plus the ONE-TIME plaintext `key` — capture it now; it can
        never be recovered later.
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The full plaintext `wlk_…` key (shown exactly once).

    # ------------------------------------------------------------- ws-ticket ---
    WsTicketRequest:
      type: object
      required: [route]
      properties:
        route:
          type: string
          enum: [record, ai-preview]
          description: The WebSocket route the ticket is scoped to.
        channel:
          type: [string, 'null']
          description: >-
            The `ai-preview` channel key (`ai-{id}` / `concierge-{id}` /
            `streaming-{key}`). REQUIRED for `ai-preview`; ignored for `record`.

    WsTicket:
      type: object
      required: [ticket, expires_in_secs]
      properties:
        ticket:
          type: string
          description: Single-use `wtk_…` ticket. Open the socket with `?ticket=<wtk_…>`.
        expires_in_secs:
          type: integer
          description: Ticket time-to-live in seconds.

    # ----------------------------------------------------------------- cloud ---
    CloudScrapeRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The page URL to scrape to markdown.
    CloudMapRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The site URL to map.
        search:
          type: string
          description: Optional plain-English intent to rank URLs by relevance.
        limit:
          type: integer
          description: Max URLs to return.
    KeylessQuota:
      type: object
      description: Remaining keyless daily allowance for the calling install.
      properties:
        tier:
          type: string
          enum: [keyless]
        requests_remaining: { type: integer }
        pages_remaining: { type: integer }
        requests_per_day: { type: integer }
        pages_per_day: { type: integer }
        reset_at:
          type: string
          format: date-time
          description: When the daily allowance refills (UTC midnight).
        upgrade_url: { type: string }
    ScrapeResult:
      type: object
      description: A single scraped page. `tier` is `keyless` or `metered`; `quota` is present on the keyless tier only.
      properties:
        verb: { type: string, enum: [scrape] }
        url: { type: string }
        title: { type: [string, 'null'] }
        format: { type: string }
        markdown: { type: string }
        counts:
          type: object
          additionalProperties: { type: integer }
        tier:
          type: string
          enum: [keyless, metered]
        quota:
          $ref: '#/components/schemas/KeylessQuota'
    MapResult:
      type: object
      description: A site's ranked URLs. `quota` is present on the keyless tier only.
      properties:
        verb: { type: string, enum: [map] }
        url: { type: string }
        host: { type: string }
        urls:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              score: { type: number }
              title: { type: [string, 'null'] }
        counts:
          type: object
          properties:
            returned: { type: integer }
            total: { type: integer }
        tier:
          type: string
          enum: [keyless, metered]
        quota:
          $ref: '#/components/schemas/KeylessQuota'

    # ----------------------------------------------------------------- crawl ---
    CrawlStartRequest:
      type: object
      description: >-
        Start a Dragnet whole-site crawl. Only `url` is required; every other field falls
        to the column default. `include_paths`/`exclude_paths` are path-regex allow/deny
        lists.
      required: [url]
      properties:
        url:
          type: string
          description: The seed URL to crawl (empty → 400).
        name:
          type: string
          description: 'Display name (defaults to a `Dragnet: <host>` label).'
        extract_mode:
          type: string
          enum: [markdown, schema]
          default: markdown
          description: Whether each page is captured as markdown or against `extract_schema`.
        extract_schema:
          type: object
          description: The extraction schema, used when `extract_mode` is `schema`.
        persona_id:
          type: integer
          format: int64
          description: Optional persona to crawl as (login identity).
        include_paths:
          type: array
          items:
            type: string
          description: Path-regex allowlist — only matching paths are crawled.
        exclude_paths:
          type: array
          items:
            type: string
          description: Path-regex denylist — matching paths are skipped.
        max_depth:
          type: integer
          format: int64
          default: 3
          description: Maximum link depth from the seed.
        page_budget:
          type: integer
          format: int64
          default: 500
          description: Hard cap on pages fetched for the whole crawl.
        max_concurrent:
          type: integer
          format: int64
          default: 4
          description: Worker-pool size (concurrent fetches).
        delay_ms:
          type: integer
          format: int64
          default: 250
          description: Politeness delay between fetches, in milliseconds.
        respect_robots:
          type: boolean
          default: true
          description: Honour the target's `robots.txt`.
        same_domain:
          type: boolean
          default: true
          description: Restrict the crawl to the seed's domain.
        allow_subdomains:
          type: boolean
          default: true
          description: Allow sibling subdomains of the seed domain (when `same_domain`).
        content:
          type: object
          description: >-
            Content-selection spec applied to every crawled page:
            {preset, include_comments, exclude_selectors, include_selectors, keep}. Omit for
            default extraction. Forwarded to the cloud when linked; honored locally otherwise.

    CrawlJob:
      type: object
      description: >-
        A Dragnet crawl job (`crawl_jobs` row), in the `to_view` projection: the JSON-TEXT
        scope columns are parsed into arrays, and the `Dragnet` brand, the
        `data_workflow_id` alias (of `workflow_id`) and the derived `is_terminal` are added.
        SQLite booleans arrive as `0`/`1` integers — kept typed as ints, not coerced.
      required: [id, name, seed_url, include_paths, exclude_paths, max_depth, same_domain,
                 allow_subdomains, extract_mode, respect_robots, delay_ms, max_concurrent,
                 page_budget, status, pages_discovered, pages_done, pages_failed,
                 pages_skipped, workers_active, current_depth, cancel_requested, brand,
                 is_terminal, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        seed_url:
          type: string
        include_paths:
          type: array
          items:
            type: string
          description: Parsed path-regex allowlist.
        exclude_paths:
          type: array
          items:
            type: string
          description: Parsed path-regex denylist.
        max_depth:
          type: integer
          format: int64
        same_domain:
          type: integer
          description: 0/1 integer flag.
        allow_subdomains:
          type: integer
          description: 0/1 integer flag.
        extract_mode:
          type: string
          description: '`markdown` | `schema`.'
        extract_schema:
          type: [object, 'null']
          description: The extraction schema (present when `extract_mode` is `schema`).
        persona_id:
          type: [integer, 'null']
          format: int64
        respect_robots:
          type: integer
          description: 0/1 integer flag.
        delay_ms:
          type: integer
          format: int64
        max_concurrent:
          type: integer
          format: int64
        page_budget:
          type: integer
          format: int64
        workflow_id:
          type: [integer, 'null']
          format: int64
          description: The synthetic per-crawl workflow the extracted pages aggregate under.
        data_workflow_id:
          type: [integer, 'null']
          format: int64
          description: Alias of `workflow_id` — read the crawl's data via this workflow id.
        concierge_session_id:
          type: [integer, 'null']
          format: int64
        status:
          type: string
          description: >-
            Open string enum: `queued` | `mapping` | `crawling` | `stopping` | `completed`
            | `failed` | `cancelled` (the last three are terminal).
          enum: [queued, mapping, crawling, stopping, completed, failed, cancelled]
        pages_discovered:
          type: integer
          format: int64
        pages_done:
          type: integer
          format: int64
        pages_failed:
          type: integer
          format: int64
        pages_skipped:
          type: integer
          format: int64
        workers_active:
          type: integer
          format: int64
        current_depth:
          type: integer
          format: int64
        error:
          type: [string, 'null']
        cancel_requested:
          type: integer
          description: 0/1 integer flag.
        brand:
          type: string
          description: Always `Dragnet`.
        is_terminal:
          type: boolean
          description: Whether `status` is one of the terminal states.
        created_at:
          type: string
        updated_at:
          type: [string, 'null']
        started_at:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']

    CrawlCancelResult:
      description: >-
        The refreshed crawl view plus `cancel_requested_now` — `true` iff this cancel call
        flipped a live crawl into `stopping`, `false` when it was already terminal.
      allOf:
        - $ref: '#/components/schemas/CrawlJob'
        - type: object
          required: [cancel_requested_now]
          properties:
            cancel_requested_now:
              type: boolean
              description: Whether this call transitioned the crawl to `stopping`.

    CrawlList:
      type: object
      description: The Dragnet crawl list payload (non-Page — a `crawls` array).
      required: [crawls]
      properties:
        crawls:
          type: array
          items:
            $ref: '#/components/schemas/CrawlJob'
